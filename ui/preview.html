<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Edge Shell — podgląd okien</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { display: flex; align-items: flex-end; justify-content: center; }
  .wrap { display: flex; gap: 12px; padding: 12px; margin-bottom: 4px; border-radius: 18px; background: rgba(18,18,21,0.96); border: 1px solid var(--line-strong); }
  .card { position: relative; width: 224px; display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: 12px; border: 1px solid transparent; background: transparent; text-align: left; }
  .card:hover { background: rgba(255,255,255,0.06); border-color: var(--line-strong); }
  .card .top { display: flex; align-items: center; gap: 6px; height: 22px; }
  .card .name { flex: 1; font-size: 12px; color: var(--text-2); }
  .card .x { width: 22px; height: 22px; border-radius: 6px; border: 0; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; opacity: 0; }
  .card:hover .x { opacity: 1; }
  .card .x:hover { background: #7f1d1d; color: #fff; }
  .slot { height: 124px; border-radius: 8px; background: rgba(255,255,255,0.03); }
  .tip { margin-bottom: 4px; padding: 5px 10px; border-radius: 8px; background: #27272a; border: 1px solid var(--line-strong); font-size: 12px; white-space: pre-line; }
  /* Karta metryki: CPU / pamięć / bateria nad dockiem. */
  .mwrap { margin-bottom: 4px; }
  .mcard { --c: #fbbf24; width: 252px; margin: 0 auto; padding: 14px 15px 13px; border-radius: 20px; background: rgba(22,23,28,.98); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 24px 50px -18px #000; }
  .mp-t { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; }
  .mp-t i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .mp-big { margin-top: 10px; font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
  .mp-big small { margin-left: 7px; font: 11px var(--mono); color: var(--muted); letter-spacing: 0; font-weight: 400; }
  .mp-bars { display: flex; align-items: flex-end; justify-content: flex-end; gap: 3px; height: 34px; margin: 11px 0 10px; }
  .mp-bars i { flex: none; width: 6px; min-height: 3px; border-radius: 2px; background: var(--c); opacity: .78; }
  .mp-rows { display: flex; flex-direction: column; gap: 7px; padding: 9px 0 11px; border-top: 1px solid rgba(255,255,255,.08); }
  .mp-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--text-2); }
  .mp-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mp-row b { flex: none; font-weight: 700; color: var(--text); }
  .mp-more { width: 100%; height: 32px; border-radius: 11px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.04); color: var(--text); font-size: 12px; font-weight: 600; }
  .mp-more:hover { background: rgba(255,255,255,.1); }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script type="module">
import { invoke, listen, esc, icon } from './shared.js';

const wrap = document.getElementById('wrap');
let inside = false;
let hideTimer = null;

function scheduleHide(ms) {
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { if (!inside) invoke('previews_hide'); }, ms);
}

document.body.addEventListener('mouseenter', () => { inside = true; clearTimeout(hideTimer); });
document.body.addEventListener('mouseleave', () => { inside = false; scheduleHide(300); });
let tipMode = false;
let metricMode = false;
listen('preview-leave', () => scheduleHide(metricMode ? 380 : tipMode ? 80 : 450));
listen('preview-tip', (text) => {
  tipMode = true;
  metricMode = false;
  clearTimeout(hideTimer);
  wrap.className = '';
  delete wrap.dataset.k;
  wrap.innerHTML = `<span class="tip">${esc(text)}</span>`;
});
listen('preview-enter', () => clearTimeout(hideTimer));

listen('previews', (wins) => {
  tipMode = false;
  metricMode = false;
  wrap.className = 'wrap';
  delete wrap.dataset.k;
  clearTimeout(hideTimer);
  wrap.innerHTML = wins.map((w) => `
    <div class="card" data-hwnd="${w.hwnd}" role="button" tabindex="0" aria-label="${esc(w.title)}">
      <div class="top"><span class="name ellipsis">${esc(w.title)}</span><button class="x" data-close="${w.hwnd}" aria-label="Zamknij okno">${icon('close', 11, 2.4)}</button></div>
      <div class="slot" data-slot="${w.hwnd}"></div>
    </div>`).join('');
  for (const c of wrap.querySelectorAll('.card')) {
    c.onclick = () => invoke('window_activate', { hwnd: Number(c.dataset.hwnd) });
  }
  for (const b of wrap.querySelectorAll('[data-close]')) {
    b.onclick = (e) => {
      e.stopPropagation();
      invoke('window_close', { hwnd: Number(b.dataset.close) });
      b.closest('.card').remove();
      if (!wrap.children.length) invoke('previews_hide'); else layout();
    };
  }
  requestAnimationFrame(layout);
});

const { emitTo } = window.__TAURI__.event;
const mText = (v) => esc(String(v));

/** Karta metryki od docka: szkielet raz, potem tylko podmiana pól (bez migania pod kursorem). */
listen('metric-card', (d) => {
  tipMode = false;
  metricMode = true;
  clearTimeout(hideTimer);
  if (wrap.dataset.k !== d.k) {
    wrap.className = 'mwrap';
    wrap.dataset.k = d.k;
    wrap.innerHTML = `<div class="mcard" style="--c:${mText(d.color)}">
      <div class="mp-t"><i></i><span data-f="title"></span></div>
      <div class="mp-big" data-f="big"></div>
      <div class="mp-bars" data-f="bars"></div>
      <div class="mp-rows" data-f="rows"></div>
      ${d.more ? '<button class="mp-more" type="button" data-more>Pokaż szczegóły</button>' : ''}
    </div>`;
    const more = wrap.querySelector('[data-more]');
    if (more) more.onclick = () => { invoke('previews_hide'); emitTo('dock', 'metric-more', { k: d.k }); };
  }
  const f = (n) => wrap.querySelector(`[data-f=${n}]`);
  f('title').textContent = d.title;
  f('big').innerHTML = `${mText(d.value)}%${d.extra ? `<small>${mText(d.extra)}</small>` : ''}`;
  f('bars').innerHTML = d.bars.map((x) => `<i style="height:${Math.max(8, Math.min(100, x))}%"></i>`).join('');
  f('rows').innerHTML = d.rows.map(([n, v]) => `<div class="mp-row"><span>${mText(n)}</span><b>${mText(v)}</b></div>`).join('');
  requestAnimationFrame(() => {
    const card = wrap.querySelector('.mcard');
    if (card) invoke('previews_metric_fit', { height: Math.ceil(card.getBoundingClientRect().height) + 8 });
  });
});

/** Przekaż backendowi, gdzie leżą sloty — tam pojawią się żywe miniatury. */
function layout() {
  const slots = [...wrap.querySelectorAll('[data-slot]')].map((el) => {
    const r = el.getBoundingClientRect();
    return { hwnd: Number(el.dataset.slot), x: r.left, y: r.top, w: r.width, h: r.height };
  });
  invoke('previews_layout', { slots });
}
</script>
</body>
</html>
