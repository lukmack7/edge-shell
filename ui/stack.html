<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Edge Shell — stos</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { display: flex; align-items: flex-end; justify-content: center; }
  .box { width: calc(100% - 8px); max-height: calc(100% - 8px); margin-bottom: 4px; display: flex; flex-direction: column; border-radius: 18px; background: rgba(18,18,21,0.97); border: 1px solid var(--line-strong); overflow: hidden; }
  header { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px 0 18px; border-bottom: 1px solid var(--line); flex: none; }
  header .t { flex: 1; font-size: 14px; font-weight: 600; }
  header .n { font-size: 12px; color: var(--muted); }
  header button { height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--fill); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  header button:hover { background: var(--fill-strong); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 10px 14px 14px; overflow-y: auto; }
  .it { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100px; padding: 10px 4px 6px; border: 0; border-radius: 12px; background: transparent; }
  .it:hover, .it:focus-visible { background: var(--fill-strong); }
  .it img, .it .ph { width: 44px; height: 44px; object-fit: contain; flex: none; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .it span { width: 100%; font-size: 12px; line-height: 1.25; color: var(--text-2); text-align: center; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
  .empty { padding: 28px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="box">
  <header><span class="t" id="title"></span><span class="n" id="count"></span><button id="open"></button></header>
  <div class="grid" id="grid"></div>
</div>
<script type="module">
import { invoke, listen, esc, icon } from './shared.js';

const $ = (id) => document.getElementById(id);
let current = null;

$('open').innerHTML = `${icon('folder', 14)} Otwórz folder`;
$('open').onclick = () => { if (current) invoke('open_path', { path: current.path }); invoke('stack_close'); };

listen('stack', (st) => {
  current = st;
  $('title').textContent = st.name;
  $('count').textContent = st.total > st.items.length ? `${st.items.length} z ${st.total}` : `${st.total}`;
  $('grid').innerHTML = st.items.length
    ? st.items.map((it) => `
      <button class="it" data-path="${esc(it.path)}" title="${esc(it.name)}">
        ${it.icon ? `<img src="${it.icon}" alt="">` : `<i class="ph">${icon(it.dir ? 'folder' : 'file', 30)}</i>`}
        <span>${esc(it.name)}</span>
      </button>`).join('')
    : '<div class="empty">Folder jest pusty</div>';
  for (const b of $('grid').querySelectorAll('.it')) {
    b.onclick = () => { invoke('open_path', { path: b.dataset.path }); invoke('stack_close'); };
  }
  $('grid').scrollTop = 0;
});

// Spacja nad plikiem: szybki podgląd.
let hovered = null;
document.addEventListener('mouseover', (e) => { hovered = e.target.closest('.it'); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') invoke('stack_close');
  const el = document.activeElement?.closest?.('.it') || hovered;
  if (e.key === ' ' && el) { e.preventDefault(); invoke('quicklook', { path: el.dataset.path }); }
});
</script>
</body>
</html>
