<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Edge Shell — ustawienia</title>
<link rel="stylesheet" href="shared.css">
<style>
  html, body { background: #0f0f11; user-select: none; }
  .app { position: absolute; inset: 0; display: grid; grid-template-columns: 232px minmax(0, 1fr); }
  nav { display: flex; flex-direction: column; gap: 2px; padding: 20px 12px; border-right: 1px solid var(--line); background: #121214; }
  nav h1 { margin: 0 10px 18px; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  nav h1 .logo { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--text); }
  nav button { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 10px; border: 0; background: transparent; color: var(--text-2); font-size: 14px; text-align: left; }
  nav button:hover { background: var(--fill); color: var(--text); }
  nav button.on { background: var(--fill-strong); color: var(--text); font-weight: 600; }
  main { display: flex; flex-direction: column; min-height: 0; }
  .content { flex: 1; min-height: 0; padding: 28px 36px 40px; }
  .page { display: none; flex-direction: column; gap: 22px; max-width: 980px; }
  .page.on { display: flex; }
  h2 { margin: 0; font-size: 24px; font-weight: 700; }
  .lead { margin: -14px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .card { display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 16px; background: #161619; border: 1px solid var(--line); }
  .card h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 14px; min-height: 44px; }
  .row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row .txt b { font-weight: 500; font-size: 14px; }
  .row .txt span { color: var(--muted); font-size: 12px; }
  .in { height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: #0f0f11; color: var(--text); font-size: 13px; outline: none; user-select: text; min-width: 0; }
  .in:focus { border-color: var(--accent); }
  select.in { padding-right: 6px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .field-l { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
  .switch { position: relative; width: 46px; height: 26px; flex: none; border-radius: 999px; border: 0; background: rgba(255,255,255,0.18); padding: 0; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(20px); }
  input[type="color"] { width: 40px; height: 40px; padding: 0; border: 1px solid var(--line-strong); border-radius: 10px; background: transparent; cursor: pointer; flex: none; }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 4px; }
  input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 6px; }
  input[type="range"] { accent-color: var(--accent); }
  .footer { flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 14px 36px; border-top: 1px solid var(--line); background: #121214; }
  .footer .status { margin-right: auto; color: var(--muted); font-size: 13px; }
  .footer .status.dirty { color: #fde68a; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: #0f0f11; border: 1px solid var(--line); }
  .mini { width: 36px; height: 36px; flex: none; border-radius: 10px; border: 0; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .mini:hover { background: var(--fill-strong); color: var(--text); }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; font-size: 12px; color: var(--text-2); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.5; }

  /* Dock */
  .preview { display: flex; justify-content: center; padding: 18px; border-radius: 16px; background: radial-gradient(600px 200px at 50% 120%, #4a1210, #121214); border: 1px solid var(--line); overflow-x: auto; }
  .pdock { display: inline-flex; align-items: flex-end; gap: 8px; padding: 10px 10px 7px; border-radius: 20px; background: rgba(16,16,19,0.9); border: 1px solid var(--line); }
  .pdock .a { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .pdock .t { width: 44px; height: 44px; border-radius: 13px; display: flex; align-items: center; justify-content: center; }
  .pdock .t img { width: 38px; height: 38px; }
  .pdock .s { width: 24px; height: 3px; border-radius: 2px; }
  .pdock .sep { width: 1px; height: 30px; margin-bottom: 12px; background: rgba(255,255,255,0.14); }
  .dockgrid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  .lane { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: #161619; border: 1px solid var(--line); }
  .lane.over { border-color: var(--accent); background: #1b1b1f; }
  .lane-head { display: flex; align-items: center; gap: 10px; }
  .lane-head .in { flex: 1; height: 36px; font-weight: 600; }
  .lane-apps { display: flex; flex-wrap: wrap; gap: 8px; min-height: 64px; padding: 8px; border-radius: 10px; border: 1.5px dashed rgba(255,255,255,0.12); }
  .lane-apps .empty { align-self: center; margin: 0 auto; }
  .app-chip { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 76px; padding: 8px 4px 6px; border-radius: 12px; border: 1px solid transparent; background: #0f0f11; cursor: grab; }
  .app-chip:hover { border-color: var(--line-strong); }
  .app-chip.sel { border-color: var(--accent); background: #1d1214; }
  .app-chip.dragging { opacity: 0.4; }
  .app-chip img, .app-chip .t { -webkit-user-drag: none; pointer-events: none; }
  .app-chip .t { width: 40px; height: 40px; border-radius: 11px; display: flex; align-items: center; justify-content: center; }
  .app-chip .t img { width: 34px; height: 34px; }
  .app-chip .n { width: 100%; font-size: 11px; text-align: center; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .editor { position: sticky; top: 0; }
  .iconpick { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .iconpick button { height: 36px; border-radius: 8px; border: 1px solid var(--line); background: #0f0f11; color: var(--text-2); display: flex; align-items: center; justify-content: center; }
  .iconpick button.on { border-color: var(--accent); color: var(--text); background: #1d1214; }

  /* Automatyzacje */
  .autogrid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; align-items: start; }
  .rules { display: flex; flex-direction: column; gap: 10px; }
  .rule { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: #161619; border: 1px solid var(--line); }
  .rule.sel { background: #1b1b1f; border-color: var(--accent); }
  .rule.off { opacity: 0.5; }
  .rule .open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 0; border: 0; background: transparent; text-align: left; }
  .rule .tag { width: 40px; height: 38px; flex: none; border-radius: 10px; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .rule .wt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  .rule .wt em { color: var(--muted); font-style: normal; }
  .rule .last { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .lbl { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
  .actrow { display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 12px; background: #0f0f11; border: 1px solid var(--line-strong); }
  .actrow .n { width: 18px; flex: none; font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: center; }
  .actrow .in { height: 34px; }
  .addact { height: 36px; border-radius: 10px; border: 1px dashed rgba(255,255,255,0.2); background: transparent; color: var(--muted); font-size: 13px; }
  .addact:hover { color: var(--text); border-color: rgba(255,255,255,0.35); }
  .logl { display: flex; gap: 12px; font-size: 13px; line-height: 1.4; }
  .logl span:first-child { flex: none; width: 74px; font-family: var(--mono); color: var(--muted); }
  .daychips .chip { min-width: 40px; justify-content: center; }

  /* Okno wyboru aplikacji */
  .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); z-index: 10; }
  .modal.on { display: flex; }
  .modal .box { width: min(640px, 92vw); max-height: 80vh; display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 18px; background: #18181b; border: 1px solid var(--line-strong); }
  .picklist { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2px; }
  .pick { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 10px; border-radius: 10px; border: 0; background: transparent; text-align: left; font-size: 13px; }
  .pick:hover { background: var(--fill-strong); }
  .pick img, .pick .ph { width: 28px; height: 28px; border-radius: 6px; flex: none; }
  .pick .ph { background: #27272a; }
  .kbdrec { min-width: 220px; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: #0f0f11; font-family: var(--mono); font-size: 13px; color: var(--text); text-align: left; }
  .kbdrec.rec { border-color: var(--accent); color: #fca5a5; }
</style>
</head>
<body>
<div class="app">
  <nav id="nav" aria-label="Sekcje ustawień">
    <h1><span class="logo" aria-hidden="true"></span>Edge Shell</h1>
  </nav>
  <main>
    <div class="content scroll" id="content"></div>
    <div class="footer">
      <span class="status" id="status">Wszystko zapisane</span>
      <button class="btn" id="revert">Cofnij zmiany</button>
      <button class="btn primary" id="save">Zapisz i zastosuj</button>
    </div>
  </main>
</div>

<div class="modal" id="picker" role="dialog" aria-label="Dodaj aplikację">
  <div class="box">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h3 style="margin:0;font-size:17px">Dodaj aplikację do docka</h3>
      <button class="mini" id="pickClose" aria-label="Zamknij"></button>
    </div>
    <input class="in" id="pickSearch" placeholder="Szukaj w zainstalowanych aplikacjach…" autocomplete="off">
    <div class="picklist scroll" id="pickList"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="pickFile">Wybierz plik .exe…</button>
      <button class="btn" id="pickUrl">Adres WWW lub URI…</button>
      <button class="btn" id="pickFolder">Folder jako stos…</button>
    </div>
  </div>
</div>

<script type="module">
import { invoke, listen, onSnapshot, esc, icon, toast, BUILTIN_ICONS } from './shared.js';

const $ = (id) => document.getElementById(id);
let cfg = null;
let saved = '';
let snap = null;
let selectedApp = null;
let startApps = null;
const iconCache = new Map();

const PAGES = [
  ['general', 'Ogólne', 'sliders'],
  ['bar', 'Górny pasek', 'layers'],
  ['dock', 'Dock', 'apps'],
  ['modes', 'Tryby', 'clock'],
  ['auto', 'Automatyzacje', 'replan'],
  ['focus', 'Fokus i ludzie', 'clock'],
  ['windows', 'Okna', 'apps'],
  ['radio', 'Radio i kontakty', 'radio'],
  ['notifications', 'Powiadomienia', 'bell'],
  ['spotify', 'Spotify', 'music'],
  ['hotkeys', 'Skróty', 'keyboard'],
];
let page = 'general';

// ------------------------------------------------------------ narzędzia

const uid = (name) => `${(name || 'app').toLowerCase().normalize('NFD').replace(/[^\w]+/g, '-').replace(/^-|-$/g, '').slice(0, 20) || 'app'}-${Math.random().toString(36).slice(2, 6)}`;
const sw = (on, key) => `<button class="switch" role="switch" aria-checked="${on ? 'true' : 'false'}" data-sw="${key}"></button>`;

function get(path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), cfg); }
function set(path, value) {
  const keys = path.split('.');
  const last = keys.pop();
  const obj = keys.reduce((o, k) => o[k], cfg);
  obj[last] = value;
  markDirty();
}
function markDirty() {
  const dirty = JSON.stringify(cfg) !== saved;
  $('status').textContent = dirty ? 'Masz niezapisane zmiany' : 'Wszystko zapisane';
  $('status').classList.toggle('dirty', dirty);
}

/** Podpina pola z atrybutami data-bind / data-num / data-sw do konfiguracji. */
function bind(root) {
  for (const el of root.querySelectorAll('[data-bind]')) {
    el.value = get(el.dataset.bind) ?? '';
    el.oninput = () => set(el.dataset.bind, el.value);
  }
  for (const el of root.querySelectorAll('[data-num]')) {
    el.value = get(el.dataset.num) ?? 0;
    el.oninput = () => {
      set(el.dataset.num, Number(el.value));
      const out = root.querySelector(`[data-out="${el.dataset.num}"]`);
      if (out) out.textContent = el.value;
    };
  }
  for (const el of root.querySelectorAll('[data-sw]')) {
    el.onclick = () => {
      const v = !get(el.dataset.sw);
      set(el.dataset.sw, v);
      el.setAttribute('aria-checked', v ? 'true' : 'false');
    };
  }
}

async function appIcon(path) {
  if (!path) return null;
  if (!iconCache.has(path)) iconCache.set(path, invoke('app_icon', { path }).catch(() => null));
  return iconCache.get(path);
}

function sectionColor(id) {
  return cfg.sections.find((s) => s.id === id)?.color || '#a1a1aa';
}
function tint(hex, t, base) {
  const h = (hex || '#a1a1aa').replace('#', '');
  const c = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) || 160);
  return `rgb(${c.map((v, i) => Math.round(v * t + base[i] * (1 - t))).join(',')})`;
}
const tileBg = (id) => tint(sectionColor(id), 0.28, [20, 20, 23]);
const tileFg = (id) => tint(sectionColor(id), 0.35, [255, 255, 255]);

/** Kafelek aplikacji: prawdziwa ikona albo wbudowana/monogram. */
function appTile(a, cls = 't') {
  const id = `ic-${a.id}-${cls}`;
  if (a.icon === 'auto') {
    appIcon(a.iconPath || a.path).then((url) => {
      const el = document.getElementById(id);
      if (!el) return;
      if (url) { el.style.background = 'transparent'; el.innerHTML = `<img src="${url}" alt="">`; }
    });
  }
  const inner = a.icon === 'auto' ? icon(a.name, 20) : icon(a.icon || a.name, 20);
  return `<span class="${cls}" id="${id}" style="background:${tileBg(a.category)};color:${tileFg(a.category)}">${inner}</span>`;
}

// ------------------------------------------------------------ strony

const render = {
  general() {
    return `
      <h2>Ogólne</h2>
      <p class="lead">Połączenie z Horologiem, start razem z Windows i zachowanie krawędzi ekranu.</p>
      <div class="card">
        <h3>Horolog</h3>
        <div class="grid2">
          <label class="field-l">Adres API<input class="in" data-bind="horolog.url" placeholder="http://homeserver.local:8000"></label>
          <label class="field-l">Adres interfejsu WWW<input class="in" data-bind="horolog.webUrl" placeholder="http://homeserver.local:3000"></label>
        </div>
        <div class="row"><button class="btn" id="testHorolog">Sprawdź połączenie</button><span class="hint" id="testResult"></span></div>
      </div>
      <div class="card">
        <h3>Windows</h3>
        <div class="row"><div class="txt"><b>Uruchamiaj z Windows</b><span>Edge Shell startuje po zalogowaniu.</span></div>${sw(cfg.shell.autostart, 'shell.autostart')}</div>
        <div class="row"><div class="txt"><b>Chowaj pasek zadań Windows</b><span>Pasek znika po starcie i wraca, gdy zamkniesz Edge Shell.</span></div>${sw(cfg.shell.hideTaskbar, 'shell.hideTaskbar')}</div>
        <div class="row"><div class="txt"><b>Rezerwuj miejsce na paski i dock</b><span>Zmaksymalizowane okna nie wchodzą pod górny pasek, lewy pasek ani stały dock (przy autoukrywaniu dock wysuwa się nad oknami).</span></div>${sw(cfg.shell.reserveTopBar, 'shell.reserveTopBar')}</div>
        <div class="row"><div class="txt"><b>Pokazuj dock</b><span>Wyłącz, jeśli wolisz inny dock.</span></div>${sw(cfg.shell.showDock, 'shell.showDock')}</div>
        <div class="row"><div class="txt"><b>Notch zamiast górnego paska</b><span>Tryb, bieżący blok, muzyka, wiadomości, status i zegar w jednym kształcie, który zmienia kolor zależnie od sytuacji. Wyłącz, żeby wrócić do klasycznego paska, okna radia i dymków.</span></div>${sw(cfg.shell.notch, 'shell.notch')}</div>
        <div class="row"><div class="txt"><b>Prawa szyna z planem dnia</b><span>Pionowa oś dnia z Horologa przy prawej krawędzi (działa razem z notchem). Klik otwiera panel Dziś.</span></div>${sw(cfg.shell.dayRail, 'shell.dayRail')}</div>
        <div class="row"><div class="txt"><b>Autoukrywanie docka</b><span>Dock chowa się i wysuwa od razu, gdy dotkniesz kursorem dolnej krawędzi pod nim.</span></div>${sw(cfg.shell.dockAutohide, 'shell.dockAutohide')}</div>
        <div class="row"><div class="txt"><b>Chowaj wszystko przy pełnym ekranie</b><span>Gra, film albo prezentacja: pasek, dock i dymki znikają, krawędzie nie wysuwają paneli.</span></div>${sw(cfg.shell.hideInFullscreen, 'shell.hideInFullscreen')}</div>
        <div class="row"><div class="txt"><b>Dymki przy prawej krawędzi</b><span>Timer i muzyka, gdy panel Teraz jest schowany.</span></div>${sw(cfg.shell.showBubbles, 'shell.showBubbles')}</div>
      </div>
      <div class="card">
        <h3>Lewy pasek i monitory</h3>
        <div class="row"><div class="txt"><b>Stały lewy pasek</b><span>Szuflada, zasobnik systemowy i szybkie akcje zawsze pod ręką.</span></div>${sw(cfg.shell.showRail, 'shell.showRail')}</div>
        <div class="row"><div class="txt"><b>Zasobnik systemowy na lewym pasku</b><span>Ikony programów działających w tle. Zmiana działa po ponownym uruchomieniu Edge Shell.</span></div>${sw(cfg.shell.trayInRail, 'shell.trayInRail')}</div>
        <div class="row"><div class="txt"><b>Pasek na każdym monitorze</b><span>Dock i panele zostają na głównym ekranie.</span></div>${sw(cfg.shell.barOnAllMonitors, 'shell.barOnAllMonitors')}</div>
      </div>
      <div class="card">
        <h3>Raport tygodnia</h3>
        <div class="row"><div class="txt"><b>Kiedy pokazać raport</b><span>Karta z sektorami tygodnia i Twoimi najlepszymi godzinami.</span></div>
          <select class="in" id="repDay">${['wyłączony', 'poniedziałek', 'wtorek', 'środa', 'czwartek', 'piątek', 'sobota', 'niedziela'].map((d, i) => `<option value="${i}" ${cfg.focus.reportWeekday === i ? 'selected' : ''}>${d}</option>`).join('')}</select>
          <input type="time" class="in" data-bind="focus.reportTime" style="width:120px">
        </div>
      </div>
      <div class="card">
        <h3>Kopia ustawień</h3>
        <div class="row"><div class="txt"><b>Folder na kopię</b><span>Np. udział na home serwerze. Po każdym zapisie trafia tam plik EdgeShell-nazwa-komputera.json. Pusty = tylko kopie na tym komputerze.</span></div></div>
        <div style="display:flex;gap:6px"><input class="in" style="flex:1" data-bind="backup.folder" placeholder="np. \\\\homeserver\\kopie"><button class="mini" id="bkPick" aria-label="Wybierz folder">${icon('folder', 16)}</button></div>
        <div class="row" style="gap:8px;justify-content:flex-start">
          <button class="btn" id="bkExport">${icon('download', 16)}Zapisz do pliku…</button>
          <button class="btn" id="bkImport">${icon('up', 16)}Wczytaj z pliku…</button>
        </div>
        <div class="field-l">Ostatnie kopie na tym komputerze
          <div class="list" id="bkList"><span class="hint">Wczytuję…</span></div>
        </div>
      </div>
      <div class="card">
        <h3>Krawędzie i fokus</h3>
        <div class="row"><div class="txt"><b>Wysuwanie paneli po dotknięciu krawędzi</b><span>Ile kursor musi stać przy krawędzi: <span data-out="shell.edgeDelayMs">${cfg.shell.edgeDelayMs}</span> ms</span></div><input type="range" min="50" max="800" step="10" data-num="shell.edgeDelayMs" style="width:240px"></div>
        <div class="row"><div class="txt"><b>Świecąca krawędź przed spotkaniem</b><span><span data-out="shell.edgeGlowMinutes">${cfg.shell.edgeGlowMinutes}</span> minut wcześniej</span></div><input type="range" min="0" max="60" step="5" data-num="shell.edgeGlowMinutes" style="width:240px"></div>
        <div class="row"><div class="txt"><b>Długość własnej sesji fokusu</b><span><span data-out="focus.adhocMinutes">${cfg.focus.adhocMinutes}</span> minut</span></div><input type="range" min="10" max="120" step="5" data-num="focus.adhocMinutes" style="width:240px"></div>
        <div class="row"><div class="txt"><b>Tygodniowy cel fokusu</b><span><span data-out="focus.weeklyGoalHours">${cfg.focus.weeklyGoalHours}</span> godzin</span></div><input type="range" min="1" max="40" step="1" data-num="focus.weeklyGoalHours" style="width:240px"></div>
      </div>`;

  bar() {
    const STATS = [
      ['network', 'Prędkość internetu', 'Pobieranie i wysyłanie na żywo'],
      ['cpu', 'Procesor', 'Obciążenie w procentach'],
      ['memory', 'Pamięć RAM', 'Zajęta pamięć'],
      ['volume', 'Dźwięk', 'Kliknięcie wycisza, kółko myszy zmienia głośność'],
      ['bluetooth', 'Bluetooth', 'Liczba połączonych urządzeń'],
      ['wifi', 'Wi‑Fi', 'Siła sygnału, nazwa sieci po najechaniu'],
      ['battery', 'Bateria', 'Tylko w laptopie'],
    ];
    const rows = STATS.map(([k, name, desc]) => `
      <div class="row"><div class="txt"><b>${name}</b><span>${desc}</span></div>${sw(cfg.bar.stats.includes(k), 'stat:' + k)}</div>`).join('');
    const pinned = cfg.pinned.map((p, n) => `
      <div class="item">
        <span class="mini" style="color:${sectionColor(p.category)}">${icon('folder', 18)}</span>
        <input class="in" style="width:160px" data-pin="${n}.name" value="${esc(p.name)}" aria-label="Nazwa">
        <input class="in" style="flex:1" data-pin="${n}.path" value="${esc(p.path)}" aria-label="Ścieżka">
        <button class="mini" data-pinpick="${n}" aria-label="Wybierz folder">${icon('folder', 16)}</button>
        <select class="in" data-pin="${n}.category" aria-label="Sekcja">${cfg.sections.map((s) => `<option value="${esc(s.id)}" ${s.id === p.category ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
        <button class="mini" data-pindel="${n}" aria-label="Usuń">${icon('trash', 16)}</button>
      </div>`).join('');
    return `
      <h2>Górny pasek</h2>
      <p class="lead">Wybierz, co ma być widać po prawej stronie paska. Kolejność jest stała: od sieci do baterii.</p>
      <div class="card"><h3>Statystyki</h3>${rows}</div>
      <div class="card">
        <h3>Przypięte foldery w szufladzie</h3>
        <div class="list">${pinned || '<span class="hint">Brak przypiętych folderów.</span>'}</div>
        <div><button class="btn" id="pinAdd">${icon('plus', 16, 2)}Dodaj folder</button></div>
      </div>`;
  },

  dock() {
    const lanes = cfg.sections.map((s, n) => {
      const apps = cfg.dock.filter((a) => a.category === s.id);
      return `
      <div class="lane" data-lane="${esc(s.id)}">
        <div class="lane-head">
          <input type="color" value="${esc(s.color)}" data-seccolor="${n}" aria-label="Kolor sekcji">
          <input class="in" value="${esc(s.name)}" data-secname="${n}" aria-label="Nazwa sekcji">
          <button class="mini" data-secup="${n}" aria-label="Sekcja wyżej" ${n === 0 ? 'disabled' : ''}>${icon('up', 16, 2)}</button>
          <button class="mini" data-secdown="${n}" aria-label="Sekcja niżej" ${n === cfg.sections.length - 1 ? 'disabled' : ''}>${icon('down', 16, 2)}</button>
          <button class="mini" data-secdel="${n}" aria-label="Usuń sekcję" ${apps.length ? 'disabled title="Najpierw przenieś aplikacje"' : ''}>${icon('trash', 16)}</button>
        </div>
        <div class="lane-apps" data-drop="${esc(s.id)}">
          ${apps.map((a) => `
            <div class="app-chip ${selectedApp === a.id ? 'sel' : ''}" draggable="true" data-app="${esc(a.id)}">
              ${appTile(a)}
              <span class="n">${esc(a.name)}</span>
            </div>`).join('') || '<span class="hint empty">Przeciągnij tu aplikację</span>'}
        </div>
      </div>`;
    }).join('');
    return `
      <h2>Dock</h2>
      <p class="lead">Przeciągaj aplikacje między sekcjami i zmieniaj ich kolejność. Między sekcjami dock sam wstawia separator, a pasek pod ikoną ma kolor sekcji.</p>
      <div class="preview"><div class="pdock" id="pdock"></div></div>
      <div style="display:flex;gap:8px">
        <button class="btn primary" id="appAdd">${icon('plus', 16, 2)}Dodaj aplikację</button>
        <button class="btn" id="secAdd">${icon('plus', 16, 2)}Nowa sekcja</button>
      </div>
      <div class="dockgrid">
        <div style="display:flex;flex-direction:column;gap:12px">${lanes}</div>
        <div class="card editor" id="editor"></div>
      </div>`;
  },

  modes() {
    const cards = cfg.modes.map((m, n) => `
      <div class="card">
        <div class="row">
          <input type="color" value="${esc(m.accent)}" data-mode="${n}.accent" aria-label="Kolor trybu">
          <input class="in" style="flex:1;font-weight:600" value="${esc(m.label)}" data-mode="${n}.label" aria-label="Nazwa trybu">
          <button class="mini" data-modedel="${n}" aria-label="Usuń tryb" ${cfg.modes.length < 2 ? 'disabled' : ''}>${icon('trash', 16)}</button>
        </div>
        <div class="row"><div class="txt"><b>Cisza</b><span>Zwykłe powiadomienia czekają na paczkę.</span></div>${sw(m.quiet, `modes.${n}.quiet`)}</div>
        <label class="field-l">Playlista Spotify (spotify:playlist:…)<input class="in" value="${esc(m.playlist)}" data-mode="${n}.playlist" placeholder="spotify:playlist:…"></label>
        <div class="grid2">
          <label class="field-l">Tapeta trybu
            <span style="display:flex;gap:6px"><input class="in" style="flex:1" value="${esc(m.wallpaper || '')}" data-mode="${n}.wallpaper" placeholder="bez zmiany"><button class="mini" data-wp="${n}" aria-label="Wybierz tapetę">${icon('image', 16)}</button></span>
          </label>
          <div class="field-l">Jasność ekranu: <span>${m.brightness == null ? 'bez zmiany' : m.brightness + '%'}</span>
            <span style="display:flex;align-items:center;gap:10px">${sw(m.brightness != null, `modebr:${n}`)}<input type="range" min="5" max="100" step="5" value="${m.brightness ?? 70}" data-br="${n}" ${m.brightness == null ? 'disabled' : ''} style="flex:1"></span>
          </div>
        </div>
        <div class="field-l">Wyciszone aplikacje w tym trybie — kliknięcie pokaże żółtą flagę
          <div class="chips">${cfg.dock.map((a) => `<button class="chip ${m.dim.includes(a.id) ? 'on' : ''}" data-dim="${n}:${esc(a.id)}">${esc(a.name)}</button>`).join('')}</div>
        </div>
      </div>`).join('');
    return `
      <h2>Tryby</h2>
      <p class="lead">Tryb zmienia kolor akcentu, tapetę i jasność, wycisza wybrane aplikacje w docku, decyduje o powiadomieniach i włącza swoją playlistę.</p>
      <div class="card"><div class="row"><div class="txt"><b>Tryb na start</b><span>Z jakim trybem uruchamia się Edge Shell.</span></div>
        <select class="in" data-bind="startMode">${cfg.modes.map((m) => `<option value="${esc(m.id)}">${esc(m.label)}</option>`).join('')}</select></div></div>
      ${cards}
      <div><button class="btn" id="modeAdd">${icon('plus', 16, 2)}Dodaj tryb</button></div>`;
  },

  radio() {
    const contacts = cfg.contacts.map((c, n) => `
      <div class="item">
        <input class="in mono" style="width:64px;text-align:center;font-weight:800;font-style:italic;color:${esc(c.color)}" value="${esc(c.number)}" data-ct="${n}.number" aria-label="Numer startowy">
        <input class="in" style="width:150px" value="${esc(c.name)}" data-ct="${n}.name" aria-label="Nazwa na karcie">
        <input type="color" value="${esc(c.color)}" data-ct="${n}.color" aria-label="Kolor">
        <input class="in" style="flex:1" value="${esc(c.matches.join(', '))}" data-ctm="${n}" placeholder="Jak podpisuje się w powiadomieniach, np. Kasia, Katarzyna" aria-label="Dopasowanie nadawcy">
        <button class="mini" data-ctdel="${n}" aria-label="Usuń">${icon('trash', 16)}</button>
      </div>`).join('');
    const times = cfg.radio.batchTimes.map((t, n) => `<span class="chip">${esc(t)}<button class="mini" style="width:22px;height:22px" data-btdel="${n}" aria-label="Usuń ${esc(t)}">${icon('close', 10, 2.4)}</button></span>`).join('');
    return `
      <h2>Radio i kontakty</h2>
      <p class="lead">Kontakty z numerem 1–9 przechodzą przez ciszę od razu. Numer i kolor widzisz na karcie radia.</p>
      <div class="card"><h3>Kontakty</h3><div class="list">${contacts || '<span class="hint">Brak kontaktów.</span>'}</div>
        <div><button class="btn" id="ctAdd">${icon('plus', 16, 2)}Dodaj kontakt</button></div></div>
      <div class="card"><h3>Paczki powiadomień</h3>
        <span class="hint">O tych godzinach w trybie cichym przychodzi wszystko, co czekało.</span>
        <div class="chips">${times}</div>
        <div class="row"><input type="time" class="in" id="btNew" style="width:140px"><button class="btn" id="btAdd">Dodaj godzinę</button></div>
      </div>
      <div class="card"><h3>Cisza nocna</h3>
        <div class="row"><div class="txt"><b>Nocą przechodzą tylko kontakty z numerem</b><span>Reszta czeka do rana (do pierwszej paczki albo od razu, jeśli tryb nie jest cichy).</span></div>${sw(cfg.radio.nightQuiet, 'radio.nightQuiet')}</div>
        <div class="row"><span class="hint">od</span><input type="time" class="in" data-bind="radio.nightStart" style="width:120px"><span class="hint">do</span><input type="time" class="in" data-bind="radio.nightEnd" style="width:120px"></div>
      </div>
      <div class="card"><h3>Lokalny endpoint</h3>
        <span class="hint">POST http://127.0.0.1:${cfg.radio.port}/radio — dla n8n, Home Assistanta, skryptów i telefonu.</span>
        <div class="grid2">
          <label class="field-l">Port<input class="in" type="number" data-num="radio.port"></label>
          <label class="field-l">Token (opcjonalny)<input class="in" data-bind="radio.token" placeholder="pusty = bez tokenu"></label>
        </div>
      </div>`;
  },

  notifications() {
    const rules = cfg.notifications.apps.map((r, n) => `
      <div class="item">
        <input class="in" style="flex:1" value="${esc(r.matches)}" data-nr="${n}.matches" placeholder="Aplikacja, np. Teams" aria-label="Aplikacja">
        <input class="in" style="width:150px" value="${esc(r.name)}" data-nr="${n}.name" placeholder="Nazwa na karcie" aria-label="Nazwa">
        <input type="color" value="${esc(r.color || '#fbbf24')}" data-nr="${n}.color" aria-label="Kolor">
        <button class="chip ${r.urgent ? 'on' : ''}" data-nrt="${n}.urgent">Pilne</button>
        <button class="chip ${r.ignore ? 'on' : ''}" data-nrt="${n}.ignore">Pomijaj</button>
        <button class="mini" data-nrdel="${n}" aria-label="Usuń">${icon('trash', 16)}</button>
      </div>`).join('');
    const status = snap?.radio?.notifications;
    return `
      <h2>Powiadomienia</h2>
      <p class="lead">Edge Shell zbiera powiadomienia wszystkich aplikacji Windows i pokazuje je jako radio.</p>
      <div class="card">
        <div class="row"><div class="txt"><b>Przechwytuj powiadomienia Windows</b><span>${status === 'ok' ? 'Działa — baza powiadomień jest czytana.' : status ? 'Problem: ' + esc(status) : 'Uruchamianie…'}</span></div>${sw(cfg.notifications.enabled, 'notifications.enabled')}</div>
        <div class="row"><div class="txt"><b>Włącz w Windows „Nie przeszkadzać”</b><span>Wtedy systemowe dymki znikają, a powiadomienia widzisz tylko jako radio.</span></div><button class="btn" id="openNotif">Otwórz ustawienia Windows</button></div>
      </div>
      <div class="card"><h3>Reguły dla aplikacji</h3>
        <span class="hint">„Pilne” przechodzi od razu nawet w ciszy, „Pomijaj” ukrywa całkiem.</span>
        <div class="list">${rules}</div>
        <div><button class="btn" id="nrAdd">${icon('plus', 16, 2)}Dodaj regułę</button></div>
      </div>`;
  },

  spotify() {
    const m = snap?.music || {};
    return `
      <h2>Spotify</h2>
      <p class="lead">Muzyka sama dopasowuje się do planu dnia. Sterowanie wymaga konta Premium.</p>
      <div class="card">
        <h3>Połączenie</h3>
        <span class="hint">1. Na developer.spotify.com utwórz aplikację i dodaj Redirect URI: <span class="mono" style="color:var(--text)">http://127.0.0.1:${cfg.spotify.redirectPort}/callback</span><br>2. Wklej jej Client ID, zapisz i kliknij „Połącz”.</span>
        <div class="grid2">
          <label class="field-l">Client ID<input class="in" data-bind="spotify.clientId" placeholder="np. 3f2a…"></label>
          <label class="field-l">Port przekierowania<input class="in" type="number" data-num="spotify.redirectPort"></label>
        </div>
        <div class="row"><button class="btn primary" id="spLogin">Połącz ze Spotify</button><span class="hint">${m.connected ? 'Połączone' : m.error ? esc(m.error) : 'Niepołączone'}</span></div>
      </div>
      <div class="card">
        <h3>Reguły</h3>
        <div class="row"><div class="txt"><b>Start bloku fokusu włącza playlistę trybu</b><span>Ściszoną do <span data-out="spotify.focusVolume">${cfg.spotify.focusVolume}</span>%</span></div>${sw(cfg.spotify.playOnFocus, 'spotify.playOnFocus')}</div>
        <div class="row"><div class="txt"><b>Głośność w fokusie</b></div><input type="range" min="5" max="100" step="5" data-num="spotify.focusVolume" style="width:240px"></div>
        <div class="row"><div class="txt"><b>Pauza w buforze</b><span>Przerwa to przerwa.</span></div>${sw(cfg.spotify.pauseOnBuffer, 'spotify.pauseOnBuffer')}</div>
        <div class="row"><div class="txt"><b>Pauza 2 minuty przed spotkaniem</b></div>${sw(cfg.spotify.pauseBeforeMeeting, 'spotify.pauseBeforeMeeting')}</div>
        <div class="row"><div class="txt"><b>Zmiana trybu przełącza playlistę</b></div>${sw(cfg.spotify.playOnModeChange, 'spotify.playOnModeChange')}</div>
      </div>`;
  },

  auto() {
    if (!cfg.automations.find((r) => r.id === selectedRule)) selectedRule = cfg.automations[0]?.id || null;
    const list = cfg.automations.map((r) => {
      const [, , color] = TRIG.find((t) => t[0] === r.trigger.kind) || TRIG[0];
      return `
      <div class="rule ${r.id === selectedRule ? 'sel' : ''} ${r.enabled ? '' : 'off'}">
        <button class="open" data-rule="${esc(r.id)}" aria-label="Edytuj regułę">
          <span class="tag" style="background:${color}">${esc(ruleTag(r))}</span>
          <span class="wt"><span><em>Gdy </em>${esc(describeTrigger(r.trigger))}</span><span><em>to </em><b style="font-weight:600">${esc(r.actions.map(describeAction).join(', ') || '— brak akcji —')}</b></span></span>
          <span class="last">${esc(autoStatus?.last?.[r.id] || '—')}</span>
        </button>
        ${sw(r.enabled, 'rule:' + r.id)}
      </div>`;
    }).join('');
    const log = (autoStatus?.log || []).map((l) => `<div class="logl"><span>${esc(l.t)}</span><span>${esc(l.text)}</span></div>`).join('')
      || '<span class="hint">Tu pojawi się, co i kiedy zrobiły reguły.</span>';
    return `
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
        <h2>Automatyzacje</h2>
        <button class="btn primary" id="ruleAdd">${icon('plus', 16, 2)}Nowa reguła</button>
      </div>
      <p class="lead">Gdy coś się dzieje, Edge Shell robi to za Ciebie. Kliknij regułę, żeby ją edytować; przełącznik ją włącza.</p>
      <div class="autogrid">
        <div class="rules">${list || '<span class="hint">Nie masz jeszcze reguł.</span>'}</div>
        <div style="display:flex;flex-direction:column;gap:14px" class="editor">
          <div class="card" id="ruleEd"></div>
          <div class="card" style="gap:8px"><span class="lbl">DZIENNIK</span>${log}</div>
        </div>
      </div>`;
  },

  focus() {
    return `
      <h2>Fokus i ludzie</h2>
      <p class="lead">Pomoc przy skupieniu: delikatne przypomnienia, start bloku z pierwszym krokiem, wieczorne zamknięcie dnia i praca „razem” z innymi.</p>
      <div class="card">
        <h3>Rozproszenia</h3>
        <div class="row"><div class="txt"><b>Karta „wracamy?”</b><span>Gdy w trakcie fokusu siedzisz w rozpraszaczu dłużej niż <span data-out="focus.distractionMinutes">${cfg.focus.distractionMinutes}</span> min. Bez blokowania.</span></div>${sw(cfg.focus.distractionAlert, 'focus.distractionAlert')}</div>
        <input type="range" min="1" max="15" step="1" data-num="focus.distractionMinutes">
        <label class="field-l">Co rozprasza (nazwa procesu albo fragment tytułu okna, np. karta YouTube w przeglądarce). Aplikacje wyciszone w trybie liczą się zawsze.
          <input class="in" id="distr" value="${esc(cfg.focus.distractions.join(', '))}"></label>

        <span class="hint">Pierwszy krok dla zadania ustawiasz w panelu Teraz (pole pod bieżącym blokiem). Bez niego karta podpowiada: „otwórz to, czego potrzebujesz, i zrób najmniejszy ruch”.</span>
      </div>
      <div class="card">
        <h3>Zamknięcie dnia</h3>
        <div class="row"><div class="txt"><b>Wieczorna karta (pon–pt)</b><span>Co zrobione, co na jutro, jedno zdanie o dniu. Ręcznie: „kd” w palecie.</span></div>${sw(cfg.focus.eveningReview, 'focus.eveningReview')}<input type="time" class="in" data-bind="focus.eveningTime" style="width:120px"></div>

      <div class="card">

      </div>`;
  },

  windows() {
    const Z = [['thirds', 'Trzy kolumny', [[0, 33], [33, 33], [66, 34]]], ['wide-center', 'Szeroki środek', [[0, 25], [25, 50], [75, 25]]], ['halves', 'Połowy', [[0, 50], [50, 50]]], ['wide-left', 'Szeroka lewa', [[0, 60], [60, 40]]], ['quarters', 'Ćwiartki', [[0, 50], [50, 50]]]];

        <div class="row"><div class="txt"><b>Ctrl+Alt+1…6</b><span>Wkłada aktywne okno do strefy o tym numerze. Zmiana działa po zapisaniu.</span></div>${sw(cfg.windows.zoneHotkeys, 'windows.zoneHotkeys')}</div>
        <div class="row"><div class="txt"><b>Odstęp między oknami</b><span><span data-out="windows.gap">${cfg.windows.gap}</span> px</span></div><input type="range" min="0" max="24" step="2" data-num="windows.gap" style="width:200px"></div>
      </div>
      <div class="card">

  ['horolog', 'Horolog', '#D42E25'], ['app', 'Aplikacja', '#5865f2'], ['battery', 'Bateria', '#52525b'], ['idle', 'Bezczynność', '#3f3f46'],
];
const ACTS = [
  ['mode', 'Przełącz tryb'], ['spotify', 'Spotify'], ['quiet', 'Radio: cisza'], ['message', 'Radio: wiadomość'],
  ['shelf', 'Połóż plik na półce'], ['minimize', 'Odłóż okna aplikacji'], ['close', 'Zamknij aplikację'], ['launch', 'Uruchom z docka'],
  ['brightness', 'Jasność'], ['volume', 'Głośność'], ['focus', 'Start fokusu'], ['hide_shell', 'Schowaj dock i paski'], ['layout', 'Układ okien'], ['one_thing', 'Jedna rzecz'], ['command', 'Polecenie (cmd)'],
];
const DAY = ['pon', 'wt', 'śr', 'czw', 'pt', 'sob', 'nd'];
const HKINDS = [['meeting', 'Spotkanie'], ['focus', 'Blok fokusu'], ['task', 'Zadanie'], ['habit', 'Nawyk'], ['any', 'Dowolny blok']];
const REVERTABLE = ['monitor', 'wifi', 'horolog', 'app', 'battery', 'idle'];
let selectedRule = null;
let autoStatus = null;
let autoLoading = false;

function newRule() {
  return {
    id: uid('regula'), enabled: true, ask: false, cooldownMin: 30, revert: false,
    trigger: { kind: 'time', time: '09:00', days: [1, 2, 3, 4, 5], monitor: '', ssid: '', folder: '%USERPROFILE%\\Downloads', pattern: '*', horologKind: 'meeting', minutesBefore: 1, app: '', fullscreen: false, batteryBelow: 20, idleMinutes: 10 },
    actions: [{ kind: 'mode', value: cfg.modes[0]?.id || 'praca' }],
  };
}

function daysLabel(days) {
  const d = [...days].sort().join(',');
  if (d === '1,2,3,4,5,6,7') return 'codziennie';
  if (d === '1,2,3,4,5') return 'w dni robocze';
  if (d === '6,7') return 'w weekend';
  if (!days.length) return 'nigdy';
  return [...days].sort().map((n) => DAY[n - 1]).join(', ');
}

function describeTrigger(t) {
  switch (t.kind) {
    case 'time': return `jest ${t.time} ${daysLabel(t.days)}`;
    case 'monitor': return t.monitor.trim() ? `podłączę monitor „${t.monitor.trim()}”` : 'podłączę dodatkowy monitor';
    case 'wifi': return `połączę się z Wi‑Fi „${t.ssid.trim()}”`;
    case 'folder': {
      const name = t.folder.replace(/[\\/]+$/, '').split(/[\\/]/).pop() || 'folder';
      const what = !t.pattern.trim() || t.pattern.trim() === '*' ? 'nowy plik' : `plik ${t.pattern.trim()}`;
      return `w folderze ${name} pojawi się ${what}`;
    }
    case 'horolog': {
      const k = { meeting: 'spotkanie', focus: 'blok fokusu', task: 'zadanie', habit: 'nawyk' }[t.horologKind] || 'dowolny blok';
      return t.minutesBefore > 0 ? `za ${t.minutesBefore} min zaczyna się ${k}` : `zaczyna się ${k}`;
    }
    case 'app':
      if (t.fullscreen && !t.app.trim()) return 'coś działa na pełnym ekranie';
      if (t.fullscreen) return `${t.app.trim()} działa na pełnym ekranie`;
      return `uruchomię ${t.app.trim() || '…'}`;
    case 'battery': return `bateria spadnie poniżej ${t.batteryBelow}%`;
    case 'idle': return `nie ruszam komputera ${t.idleMinutes} min`;
    default: return t.kind;
  }
}

function describeAction(a) {
  const v = (a.value || '').trim();
  switch (a.kind) {
    case 'mode': return `tryb ${cfg.modes.find((m) => m.id === v)?.label || v}`;
    case 'spotify': return { pause: 'Spotify: pauza', next: 'Spotify: następny' }[v] || (v.startsWith('spotify:') ? 'Spotify: playlista' : 'Spotify: graj');
    case 'quiet': return !v ? 'radio: tylko pilne' : v.includes(':') ? `radio: cisza do ${v}` : `radio: cisza na ${v} min`;
    case 'message': return `radio: „${v}”`;
    case 'shelf': return 'połóż na półce';
    case 'minimize': return `odłóż okna: ${v}`;
    case 'close': return `zamknij: ${v}`;
    case 'launch': return `uruchom ${cfg.dock.find((d) => d.id === v)?.name || v}`;
    case 'brightness': return `jasność ${v}%`;
    case 'volume': return `głośność ${v}%`;
    case 'focus': return `fokus ${v} min`;
    case 'hide_shell': return 'schowaj dock i paski';
    case 'layout': return v ? `układ okien „${v}”` : 'układ okien trybu';
    case 'one_thing': return 'jedna rzecz';
    case 'command': return `polecenie: ${v}`;
    default: return a.kind;
  }
}

function ruleTag(r) {
  return { time: r.trigger.time, monitor: 'MON', wifi: 'WiFi', folder: 'DIR', horolog: 'H', app: 'APP', battery: 'BAT', idle: 'ZZZ' }[r.trigger.kind] || '?';
}

function actionValue(a, n) {
  const opt = (v, l) => `<option value="${esc(v)}" ${a.value === v ? 'selected' : ''}>${esc(l)}</option>`;
  switch (a.kind) {
    case 'mode': return `<select class="in" style="flex:1" data-av="${n}">${cfg.modes.map((m) => opt(m.id, m.label)).join('')}</select>`;
    case 'spotify': {
      const custom = a.value.startsWith('spotify:');
      return `<select class="in" style="flex:1" data-av="${n}">${opt('play', 'graj')}${opt('pause', 'pauza')}${opt('next', 'następny')}<option value="spotify:" ${custom ? 'selected' : ''}>playlista…</option></select>
        ${custom ? `<input class="in" style="flex:1" data-avt="${n}" value="${esc(a.value)}" placeholder="spotify:playlist:…">` : ''}`;
    }
    case 'launch': return `<select class="in" style="flex:1" data-av="${n}">${cfg.dock.map((d) => opt(d.id, d.name)).join('')}</select>`;
    case 'shelf': case 'hide_shell': case 'one_thing': return '<span class="hint" style="flex:1">bez ustawień</span>';
    case 'layout': return `<select class="in" style="flex:1" data-av="${n}"><option value="" ${!a.value ? 'selected' : ''}>układ bieżącego trybu</option>${(autoStatus?.layouts || []).map((l) => opt(l, l)).join('')}</select>`;
    default: {
      const ph = { quiet: '12:00, 30 (min) albo puste = do końca', message: 'treść karty, {plik} = nazwa pliku', minimize: 'Discord.exe, Steam.exe', close: 'Discord.exe',
        brightness: '0–100', volume: '0–100', focus: 'minuty, np. 45', command: 'np. tailscale set --exit-node=' }[a.kind] || '';
      return `<input class="in" style="flex:1" data-avt="${n}" value="${esc(a.value)}" placeholder="${esc(ph)}">`;
    }
  }
}

function triggerFields(t) {
  switch (t.kind) {
    case 'time': return `
      <div class="row" style="min-height:0"><input type="time" class="in" id="tTime" value="${esc(t.time)}" style="width:130px"><span class="hint">${esc(daysLabel(t.days))}</span></div>
      <div class="chips daychips">${DAY.map((d, i) => `<button class="chip ${t.days.includes(i + 1) ? 'on' : ''}" data-day="${i + 1}">${d}</button>`).join('')}</div>`;
    case 'monitor': return `
      <input class="in" id="tMon" value="${esc(t.monitor)}" placeholder="fragment nazwy, np. DELL — puste = dowolny dodatkowy">
      <span class="hint">${autoStatus?.monitors?.length ? `Teraz wykryte: ${autoStatus.monitors.map((m) => `<button class="chip" data-mon="${esc(m)}">${esc(m)}</button>`).join(' ')}` : 'Wykrywam monitory…'}</span>`;
    case 'wifi': return `
      <input class="in" id="tSsid" value="${esc(t.ssid)}" placeholder="nazwa sieci">
      ${autoStatus?.ssid ? `<span class="hint">Teraz: <button class="chip" id="tSsidNow">${esc(autoStatus.ssid)}</button></span>` : ''}`;
    case 'folder': return `
      <span style="display:flex;gap:6px"><input class="in" style="flex:1" id="tDir" value="${esc(t.folder)}"><button class="mini" id="tDirPick" aria-label="Wybierz folder">${icon('folder', 16)}</button></span>
      <label class="field-l">Pliki pasujące do wzorca<input class="in" id="tPat" value="${esc(t.pattern)}" placeholder="*.pdf"></label>`;
    case 'horolog': return `
      <div class="row" style="min-height:0"><select class="in" id="tHk" style="flex:1">${HKINDS.map(([k, l]) => `<option value="${k}" ${t.horologKind === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <input type="number" class="in" id="tMb" min="0" max="60" value="${t.minutesBefore}" style="width:80px"><span class="hint">min przed</span></div>`;
    case 'app': return `
      <input class="in" id="tApp" value="${esc(t.app)}" placeholder="proces, np. steam.exe — puste = dowolna">
      <div class="row" style="min-height:0"><div class="txt"><b>Tylko na pełnym ekranie</b><span>Gra, film, prezentacja</span></div>${sw(t.fullscreen, 'tfs')}</div>`;
    case 'battery': return `<div class="row" style="min-height:0"><input type="range" min="5" max="60" step="5" id="tBat" value="${t.batteryBelow}" style="flex:1"><span id="tBatV" class="mono">${t.batteryBelow}%</span></div>`;
    case 'idle': return `<div class="row" style="min-height:0"><input type="number" class="in" id="tIdle" min="1" max="240" value="${t.idleMinutes}" style="width:90px"><span class="hint">minut bez ruchu myszy i klawiatury</span></div>`;
    default: return '';
  }
}

function renderRuleEditor() {
  const el = $('ruleEd');
  if (!el) return;
  const r = cfg.automations.find((x) => x.id === selectedRule);
  if (!r) { el.innerHTML = '<h3>Edycja reguły</h3><span class="hint">Dodaj regułę przyciskiem „Nowa reguła”.</span>'; return; }
  const t = r.trigger;
  const COOL = [[0, 'bez limitu'], [5, 'raz na 5 min'], [15, 'raz na 15 min'], [30, 'raz na 30 min'], [60, 'raz na godzinę'], [240, 'raz na 4 h'], [1440, 'raz na dobę']];
  el.innerHTML = `
    <h3>Edycja reguły</h3>
    <span class="lbl">GDY</span>
    <div class="chips">${TRIG.map(([k, l]) => `<button class="chip ${t.kind === k ? 'on' : ''}" data-tk="${k}">${l}</button>`).join('')}</div>
    ${triggerFields(t)}
    <span class="lbl">TO (W TEJ KOLEJNOŚCI)</span>
    ${r.actions.map((a, n) => `
      <div class="actrow">
        <span class="n">${n + 1}.</span>
        <select class="in" style="width:150px" data-ak="${n}">${ACTS.map(([k, l]) => `<option value="${k}" ${a.kind === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
        ${actionValue(a, n)}
        <button class="mini" data-aup="${n}" aria-label="Wyżej" ${n === 0 ? 'disabled' : ''} style="width:28px">${icon('up', 14, 2)}</button>
        <button class="mini" data-adel="${n}" aria-label="Usuń akcję" style="width:28px">${icon('trash', 14)}</button>
      </div>`).join('')}
    <button class="addact" id="aAdd">+ dodaj akcję</button>
    <div class="row" style="min-height:36px"><div class="txt"><b>Najpierw zapytaj</b><span>Karta radia z „Tak / Nie”</span></div>${sw(r.ask, 'rask')}</div>
    ${REVERTABLE.includes(t.kind) ? `<div class="row" style="min-height:36px"><div class="txt"><b>Gdy warunek minie, przywróć</b><span>Np. po spotkaniu Spotify gra dalej, okna wracają</span></div>${sw(r.revert, 'rrev')}</div>` : ''}
    <div class="row" style="min-height:36px"><div class="txt"><b>Nie częściej niż</b></div><select class="in" id="rCool">${COOL.map(([v, l]) => `<option value="${v}" ${r.cooldownMin === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="rRun" style="flex:1">Uruchom teraz</button>
      <button class="btn primary" id="rSave" style="flex:1">Zapisz</button>
      <button class="mini" id="rDel" aria-label="Usuń regułę" style="color:#fca5a5">${icon('trash', 16)}</button>
    </div>`;

  const redraw = () => { markDirty(); show(page); };
  const setT = (k, v, again = false) => { t[k] = v; markDirty(); if (again) show(page); else refreshListOnly(); };
  for (const b of el.querySelectorAll('[data-tk]')) b.onclick = () => {
    t.kind = b.dataset.tk;
    if (!REVERTABLE.includes(t.kind)) r.revert = false;
    if (t.kind === 'horolog' || t.kind === 'app') r.revert = true;
    redraw();
  };
  for (const b of el.querySelectorAll('[data-day]')) b.onclick = () => {
    const d = +b.dataset.day;
    t.days = t.days.includes(d) ? t.days.filter((x) => x !== d) : [...t.days, d].sort();
    redraw();
  };
  const on = (id, ev, fn) => { const x = $(id); if (x) x[ev] = fn; };
  on('tTime', 'onchange', (e) => setT('time', e.target.value || '09:00', true));
  on('tMon', 'oninput', (e) => setT('monitor', e.target.value));
  for (const b of el.querySelectorAll('[data-mon]')) b.onclick = () => setT('monitor', b.dataset.mon, true);
  on('tSsid', 'oninput', (e) => setT('ssid', e.target.value));
  on('tSsidNow', 'onclick', () => setT('ssid', autoStatus.ssid, true));
  on('tDir', 'onchange', (e) => setT('folder', e.target.value.trim(), true));
  on('tDirPick', 'onclick', async () => { const p = await invoke('pick_path', { folder: true }); if (p) setT('folder', p, true); });
  on('tPat', 'oninput', (e) => setT('pattern', e.target.value.trim() || '*'));
  on('tHk', 'onchange', (e) => setT('horologKind', e.target.value, true));
  on('tMb', 'onchange', (e) => setT('minutesBefore', Math.max(0, +e.target.value || 0), true));
  on('tApp', 'oninput', (e) => setT('app', e.target.value.trim()));
  on('tBat', 'oninput', (e) => { $('tBatV').textContent = `${e.target.value}%`; setT('batteryBelow', +e.target.value); });
  on('tIdle', 'onchange', (e) => setT('idleMinutes', Math.max(1, +e.target.value || 10), true));
  for (const b of el.querySelectorAll('[data-sw]')) {
    b.onclick = () => {
      const k = b.dataset.sw;
      if (k === 'tfs') t.fullscreen = !t.fullscreen;
      if (k === 'rask') r.ask = !r.ask;
      if (k === 'rrev') r.revert = !r.revert;
      redraw();
    };
  }
  for (const s2 of el.querySelectorAll('[data-ak]')) s2.onchange = () => {
    const a = r.actions[+s2.dataset.ak];
    a.kind = s2.value;
    a.value = { mode: cfg.modes[0]?.id || '', spotify: 'play', launch: cfg.dock[0]?.id || '', brightness: '50', volume: '30', focus: '25' }[a.kind] || '';
    redraw();
  };
  for (const s2 of el.querySelectorAll('[data-av]')) s2.onchange = () => {
    r.actions[+s2.dataset.av].value = s2.value === 'spotify:' ? 'spotify:playlist:' : s2.value;
    redraw();
  };
  for (const i2 of el.querySelectorAll('[data-avt]')) i2.oninput = () => { r.actions[+i2.dataset.avt].value = i2.value; markDirty(); refreshListOnly(); };
  for (const b of el.querySelectorAll('[data-aup]')) b.onclick = () => {
    const n = +b.dataset.aup;
    [r.actions[n - 1], r.actions[n]] = [r.actions[n], r.actions[n - 1]];
    redraw();
  };
  for (const b of el.querySelectorAll('[data-adel]')) b.onclick = () => { r.actions.splice(+b.dataset.adel, 1); redraw(); };
  $('aAdd').onclick = () => { r.actions.push({ kind: 'message', value: '' }); redraw(); };
  $('rCool').onchange = (e) => { r.cooldownMin = +e.target.value; markDirty(); };
  $('rRun').onclick = async () => {
    try { await invoke('automation_run', { rule: r }); toast('Wykonano'); autoLoading = false; setTimeout(() => show(page), 900); }
    catch (e) { toast(String(e), 4000); }
  };
  $('rSave').onclick = save;
  $('rDel').onclick = () => {
    cfg.automations = cfg.automations.filter((x) => x.id !== r.id);
    selectedRule = cfg.automations[0]?.id || null;
    redraw();
  };
}

/** Odśwież tylko opis reguły na liście (bez przerysowania edytora z polem w trakcie pisania). */
function refreshListOnly() {
  const r = cfg.automations.find((x) => x.id === selectedRule);
  const btn = document.querySelector(`[data-rule="${CSS.escape(selectedRule || '')}"] .wt`);
  if (!r || !btn) return;
  btn.innerHTML = `<span><em>Gdy </em>${esc(describeTrigger(r.trigger))}</span><span><em>to </em><b style="font-weight:600">${esc(r.actions.map(describeAction).join(', ') || '— brak akcji —')}</b></span>`;
}

// ------------------------------------------------------------ paleta: klawisze

const PALETTE_CMDS = [
  ['focus', 'Start fokusu'], ['focus_block', 'Fokus na bieżący blok'], ['pause', 'Pauza / wznów'], ['capture', 'Wrzuć myśl'],
  ['stash', 'Odłóż okna do garażu'], ['spotify', 'Spotify: play / pauza'], ['spotify_next', 'Spotify: następny'],
  ['tailscale', 'Tailscale: exit node'], ['tailscale_off', 'Tailscale: wyłącz'], ['calc', 'Kalkulator'],
  ['replan', 'Przeplanuj dzień'], ['report', 'Raport tygodnia'], ['settings', 'Ustawienia'],
];
function paletteCommands() {
  return [...PALETTE_CMDS, ...cfg.modes.map((m) => [`mode:${m.id}`, `Tryb ${m.label}`])];
}
function paletteKey(cmd) {
  const k = cfg.palette.keys.find((x) => x.cmd === cmd);
  if (k) return k.key;
  if (cmd.startsWith('mode:')) {
    const m = cfg.modes.find((x) => `mode:${x.id}` === cmd);
    return m ? `t${m.label[0].toLowerCase()}` : '';
  }
  return '';
}

// ------------------------------------------------------------ dock: podgląd i edytor

function renderPreview() {
  const el = $('pdock');
  if (!el) return;
  const order = cfg.sections.map((s) => s.id);
  const apps = [...cfg.dock].sort((a, b) => order.indexOf(a.category) - order.indexOf(b.category));
  el.innerHTML = apps.map((a, n) => {
    const sep = apps[n + 1] && apps[n + 1].category !== a.category ? '<span class="sep"></span>' : '';
    return `<span class="a">${appTile({ ...a, id: a.id + '-pv' })}<span class="s" style="background:${sectionColor(a.category)}"></span></span>${sep}`;
  }).join('');
}

function renderEditor() {
  const el = $('editor');
  if (!el) return;
  const a = cfg.dock.find((x) => x.id === selectedApp);
  if (!a) {
    el.innerHTML = '<h3>Edycja aplikacji</h3><span class="hint">Kliknij aplikację, żeby zmienić jej nazwę, ikonę, sekcję albo ścieżkę. Prawy klik na docku otwiera te ustawienia.</span>';
    return;
  }
  const mode = a.icon === 'auto' ? 'auto' : BUILTIN_ICONS.includes(a.icon) ? 'builtin' : 'text';
  el.innerHTML = `
    <div class="row" style="min-height:0">${appTile({ ...a, id: a.id + '-ed' })}<h3 style="flex:1">${esc(a.name)}</h3></div>
    <label class="field-l">Nazwa<input class="in" id="edName" value="${esc(a.name)}"></label>
    <label class="field-l">Co uruchomić (plik .exe, skrót, adres WWW, URI albo folder — folder otwiera się jako stos)
      <span style="display:flex;gap:6px"><input class="in" style="flex:1" id="edPath" value="${esc(a.path)}"><button class="mini" id="edPick" aria-label="Wybierz plik">${icon('folder', 16)}</button></span>
    </label>
    <label class="field-l">Sekcja<select class="in" id="edSec">${cfg.sections.map((s) => `<option value="${esc(s.id)}" ${s.id === a.category ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
    <div class="field-l">Ikona
      <div class="chips">
        <button class="chip ${mode === 'auto' ? 'on' : ''}" data-im="auto">Z aplikacji</button>
        <button class="chip ${mode === 'builtin' ? 'on' : ''}" data-im="builtin">Wbudowana</button>
        <button class="chip ${mode === 'text' ? 'on' : ''}" data-im="text">Litery</button>
      </div>
    </div>
    ${mode === 'builtin' ? `<div class="iconpick">${BUILTIN_ICONS.map((i) => `<button class="${a.icon === i ? 'on' : ''}" data-ib="${i}" aria-label="${i}">${icon(i, 18)}</button>`).join('')}</div>` : ''}
    ${mode === 'text' ? `<label class="field-l">Litery (1–2)<input class="in" id="edText" maxlength="2" value="${esc(a.icon)}"></label>` : ''}
    ${mode === 'auto' ? `<label class="field-l">Ikona z innego pliku (opcjonalnie)<span style="display:flex;gap:6px"><input class="in" style="flex:1" id="edIconPath" value="${esc(a.iconPath)}" placeholder="pusta = z pola „Co uruchomić”"><button class="mini" id="edIconPick" aria-label="Wybierz plik ikony">${icon('folder', 16)}</button></span></label>` : ''}
    <label class="field-l">Proces (kropka „uruchomione”)<input class="in" id="edProc" value="${esc(a.process)}" placeholder="np. chrome.exe"></label>
    <button class="btn" id="edDel" style="color:#fca5a5">${icon('trash', 16)}Usuń z docka</button>`;
  const upd = (f, v, rerender = false) => { a[f] = v; markDirty(); if (rerender) show(page); else renderPreview(); };
  $('edName').oninput = (e) => upd('name', e.target.value);
  $('edName').onchange = () => show(page);
  $('edPath').onchange = (e) => {
    upd('path', e.target.value.trim(), true);
    if (!a.process && /\.exe$/i.test(a.path)) { a.process = a.path.split(/[\\/]/).pop(); }
  };
  $('edPick').onclick = async () => {
    const p = await invoke('pick_path', { folder: false });
    if (!p) return;
    a.path = p;
    if (/\.exe$/i.test(p)) a.process = p.split(/[\\/]/).pop();
    markDirty(); show(page);
  };
  $('edSec').onchange = (e) => upd('category', e.target.value, true);
  for (const b of el.querySelectorAll('[data-im]')) {
    b.onclick = () => {
      const m = b.dataset.im;
      upd('icon', m === 'auto' ? 'auto' : m === 'builtin' ? 'folder' : a.name.slice(0, 2).toUpperCase(), true);

  if ($('edText')) $('edText').onchange = (e) => upd('icon', e.target.value.toUpperCase() || '?', true);
  if ($('edIconPath')) $('edIconPath').onchange = (e) => { iconCache.delete(a.iconPath); upd('iconPath', e.target.value.trim(), true); };
  if ($('edIconPick')) $('edIconPick').onclick = async () => {
    const p = await invoke('pick_path', { folder: false });
    if (p) upd('iconPath', p, true);
  };
  $('edProc').oninput = (e) => upd('process', e.target.value.trim());
  $('edDel').onclick = () => {
    cfg.dock = cfg.dock.filter((x) => x.id !== a.id);
    for (const m of cfg.modes) m.dim = m.dim.filter((d) => d !== a.id);
    selectedApp = null;
    markDirty(); show(page);
  };
}

// ------------------------------------------------------------ wybór aplikacji

async function openPicker() {
  $('picker').classList.add('on');
  $('pickSearch').value = '';
  $('pickSearch').focus();
  if (!startApps) startApps = await invoke('search_index').catch(() => []);
  renderPicks();
}
function closePicker() { $('picker').classList.remove('on'); }

function renderPicks() {
  const q = $('pickSearch').value.trim().toLowerCase();
  const list = (startApps || []).filter((a) => !q || a.name.toLowerCase().includes(q)).slice(0, 80);
  $('pickList').innerHTML = list.map((a, n) => `<button class="pick" data-n="${n}"><span class="ph" id="pk-${n}"></span><span class="ellipsis">${esc(a.name)}</span></button>`).join('')
    || '<span class="hint" style="padding:10px">Nic nie znaleziono — wybierz plik ręcznie.</span>';
  list.slice(0, 30).forEach((a, n) => appIcon(a.path).then((url) => {
    const ph = document.getElementById(`pk-${n}`);
    if (url && ph) ph.outerHTML = `<img src="${url}" alt="">`;
  }));
  for (const b of $('pickList').querySelectorAll('.pick')) {
    b.onclick = () => { const a = list[+b.dataset.n]; addApp(a.name, a.path); };
  }
}

function addApp(name, path) {
  const exe = /\.exe$/i.test(path) ? path.split(/[\\/]/).pop() : '';
  const app = { id: uid(name), name, path, args: [], category: cfg.sections[0]?.id || 'praca', icon: /^https?:/i.test(path) ? 'globe' : 'auto', process: exe, iconPath: '', separatorAfter: false };
  cfg.dock.push(app);
  selectedApp = app.id;
  markDirty();
  closePicker();
  show('dock');
}

$('pickClose').innerHTML = icon('close', 14, 2.4);
$('pickClose').onclick = closePicker;
$('picker').onclick = (e) => { if (e.target === $('picker')) closePicker(); };
$('pickSearch').oninput = renderPicks;
$('pickFile').onclick = async () => {
  const p = await invoke('pick_path', { folder: false });
  if (p) addApp(p.split(/[\\/]/).pop().replace(/\.(exe|lnk|url)$/i, ''), p);
};
$('pickFolder').onclick = async () => {
  const p = await invoke('pick_path', { folder: true });
  if (p) addApp(p.split(/[\\/]/).filter(Boolean).pop() || 'Folder', p);
};
$('pickUrl').onclick = () => {
  const url = prompt('Adres WWW albo URI (np. https://…, spotify:, ms-settings:)');
  if (url) addApp(url.replace(/^https?:\/\/(www\.)?/i, '').split(/[/:]/)[0] || 'Skrót', url.trim());
};

// ------------------------------------------------------------ szkielet

function show(p) {
  page = p;
  for (const b of $('nav').querySelectorAll('button')) b.classList.toggle('on', b.dataset.page === p);
  const scroll = $('content').scrollTop;
  $('content').innerHTML = `<section class="page on">${render[p]()}</section>`;
  const root = $('content').firstElementChild;
  bind(root);
  after[p]?.(root);
  $('content').scrollTop = scroll;
}

async function load() {
  cfg = await invoke('get_config');
  // Uzupełnij brakujące pola starszych konfiguracji.
  cfg.sections ||= [];
  cfg.bar ||= { stats: [] };
  cfg.backup ||= { folder: '' };
  cfg.palette ||= { keys: [], tailscaleNode: '', folders: [] };
  cfg.automations ||= [];
  cfg.presence ||= { enabled: false, url: '', name: '', token: '', shareTask: false };
  cfg.windows ||= { zones: 'thirds', shiftDrag: true, zoneHotkeys: true, gap: 8 };
  cfg.focus.distractions ||= [];
  for (const a of cfg.dock) { a.iconPath ??= ''; a.icon ??= 'auto'; }
  saved = JSON.stringify(cfg);
  markDirty();
  show(page);
}

async function save() {
  try {
    await invoke('save_config', { config: cfg });
    saved = JSON.stringify(cfg);
    markDirty();
    toast('Zapisano i zastosowano');
  } catch (e) {
    toast(`Nie zapisano: ${e}`, 4000);
  }
}

$('nav').insertAdjacentHTML('beforeend', PAGES.map(([id, name, ic]) => `<button data-page="${id}">${icon(ic, 18)}${name}</button>`).join(''));
for (const b of $('nav').querySelectorAll('button')) b.onclick = () => show(b.dataset.page);
$('save').onclick = save;
$('revert').onclick = () => { cfg = JSON.parse(saved); markDirty(); show(page); };
window.addEventListener('keydown', (e) => { if (e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } });

let statusKey = '';
onSnapshot((s) => {
  snap = s;
  // Przerysuj tylko, gdy zmienił się status widoczny na stronie.
  const key = JSON.stringify([s.radio?.notifications, s.music?.connected, s.music?.error]);
  if (key === statusKey) return;
  statusKey = key;
  if (['notifications', 'spotify'].includes(page) && cfg && !document.activeElement?.matches('input, select')) show(page);
});
listen('config-changed', () => { if (cfg && JSON.stringify(cfg) === saved) load(); });
load();
</script>
</body>
