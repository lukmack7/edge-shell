<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Edge Shell — notch</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* Klasy z prefiksem n- — shared.css ma własne .panel/.btn i to one rozjechały poprzedni panel. */
  html, body { background: transparent; overflow: hidden; }
  #n { position: absolute; left: 50%; top: 0; transform: translateX(-50%); box-sizing: border-box; overflow: hidden;
       background: var(--bg, rgba(16,16,19,0.96)); border: 1px solid var(--edge, rgba(255,255,255,0.08)); border-top: 0;
       border-radius: 0 0 18px 18px; box-shadow: 0 14px 30px -14px rgba(0,0,0,0.85);
       transition: width 0.45s cubic-bezier(.2,1.2,.35,1), height 0.45s cubic-bezier(.2,1.2,.35,1), border-radius 0.45s, background 0.35s, border-color 0.35s; }
  .n-row { width: max-content; height: 39px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 7px; white-space: nowrap; font-size: 12.5px; }
  .n-lead { display: flex; align-items: center; gap: 10px; min-width: 0; height: 100%; }
  .n-mode { display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 999px; border: 0; background: var(--modeBg, rgba(212,46,37,0.18)); color: var(--modeFg, #fca5a5); font-weight: 600; font-size: 12px; flex: none; }
  .n-mode i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .n-mid { display: flex; align-items: center; gap: 10px; max-width: 470px; min-width: 0; cursor: default; }
  .n-mid .t { overflow: hidden; text-overflow: ellipsis; min-width: 0; color: #e4e4e7; }
  .n-mid .t b { font-weight: 700; }
  .n-mid .t .dim { color: rgba(255,255,255,0.72); }
  .n-mid .c { font-family: var(--mono); font-weight: 600; flex: none; font-variant-numeric: tabular-nums; }
  .n-ic { width: 22px; height: 22px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; }
  .n-art { width: 22px; height: 22px; flex: none; border-radius: 7px; background: #222 center/cover; }
  .n-eq { display: flex; gap: 2px; align-items: flex-end; height: 13px; flex: none; }
  .n-eq i { width: 3px; border-radius: 2px; background: #f9a8d4; animation: eq 0.9s ease-in-out infinite alternate; }
  .n-eq i:nth-child(2) { animation-delay: -0.3s; } .n-eq i:nth-child(3) { animation-delay: -0.6s; } .n-eq i:nth-child(4) { animation-delay: -0.15s; }
  .n-eq.stop i { animation: none; height: 3px !important; }
  @keyframes eq { from { height: 3px; } to { height: 13px; } }
  .n-tb { width: 24px; height: 24px; flex: none; border-radius: 50%; border: 0; background: transparent; color: rgba(255,255,255,0.85); display: flex; align-items: center; justify-content: center; }
  .n-tb:hover { background: rgba(255,255,255,0.14); }
  .n-tb.w { background: #fff; color: #000; }
  .n-act { height: 24px; padding: 0 11px; border-radius: 999px; border: 0; background: #fff; color: #000; font-size: 11.5px; font-weight: 700; flex: none; }
  .n-act.g { background: rgba(255,255,255,0.16); color: #fff; }
  .n-cnt { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; border: 0; background: #fbbf24; color: #1c1917; font-size: 11px; font-weight: 800; flex: none; }
  .n-st { display: flex; align-items: center; gap: 2px; color: #d4d4d8; flex: none; }
  .n-sb { height: 28px; padding: 0 6px; border-radius: 8px; border: 0; background: transparent; color: inherit; display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .n-sb:hover { background: rgba(255,255,255,0.1); }
  .n-clock { height: 28px; padding: 0 8px; border-radius: 8px; border: 0; background: transparent; color: #e4e4e7; display: flex; align-items: center; gap: 9px; font-size: 12.5px; flex: none; }
  .n-clock:hover { background: rgba(255,255,255,0.1); }
  .n-clock .sep { width: 1px; height: 14px; background: rgba(255,255,255,0.28); }
  .n-clock .tm { font-variant-numeric: tabular-nums; }
  .n-reply { display: flex; gap: 8px; padding: 2px 12px 10px 14px; }
  .n-reply input { flex: 1; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.25); background: rgba(0,0,0,0.35); color: #fff; font-size: 13px; outline: none; user-select: text; }
  .n-reply input:focus { border-color: #fff; }
  /* panel */
  .n-pn { width: 940px; box-sizing: border-box; padding: 4px 18px 18px; margin: 0 auto; }
  .n-modes { display: flex; align-items: center; gap: 6px; }
  .n-modes button { height: 26px; padding: 0 11px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.05); color: #d4d4d8; font-size: 12px; font-weight: 600; }
  .n-modes button:hover { background: rgba(255,255,255,0.1); }
  .n-people { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #8b8b98; }
  .n-pp { width: 22px; height: 22px; border-radius: 50%; background: #27272a; box-shadow: 0 0 0 2px var(--st); font-size: 10px; font-weight: 700; color: #e5e7eb; display: flex; align-items: center; justify-content: center; }
  .n-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; margin-top: 12px; }
  .n-card { min-height: 190px; box-sizing: border-box; border-radius: 18px; padding: 16px 18px; display: flex; gap: 16px; align-items: center; border: 1px solid rgba(255,255,255,0.08); }
  .n-ring { width: 108px; height: 108px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .n-ring span { width: 90px; height: 90px; border-radius: 50%; background: #141416; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 19px; font-weight: 600; }
  .n-kick { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; }
  .n-side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .n-box { border-radius: 15px; background: rgba(255,255,255,0.05); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
  .n-box .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; color: #71717a; display: flex; }
  .n-it { display: flex; gap: 8px; align-items: center; min-width: 0; border: 0; background: transparent; padding: 2px 0; text-align: left; color: #e4e4e7; font-size: 12.5px; border-radius: 6px; }
  button.n-it:hover { background: rgba(255,255,255,0.06); }
  .n-it .tm { font-family: var(--mono); color: #71717a; flex: none; }
  .n-it .tx { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .n-it b { font-weight: 600; flex: none; }
  .n-it .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .n-quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .n-q { height: 40px; border-radius: 13px; border: 0; background: rgba(255,255,255,0.05); color: #d4d4d8; display: flex; align-items: center; justify-content: center; }
  .n-q:hover, .n-deep button:hover { background: rgba(255,255,255,0.1); }
  .n-deep { display: flex; flex-wrap: wrap; gap: 6px; }
  .n-deep button { height: 28px; padding: 0 11px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.05); color: #d4d4d8; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .n-b2 { height: 30px; padding: 0 12px; border-radius: 999px; border: 0; font-size: 12px; font-weight: 600; background: rgba(255,255,255,0.1); color: #fff; }
  .n-b2.w { background: #fff; color: #000; }
  .n-bell { position: relative; }
  .n-bell .bd { position: absolute; top: 1px; right: 0; min-width: 14px; height: 14px; padding: 0 3px; box-sizing: border-box; border-radius: 7px; background: #fbbf24; color: #1c1917; font-size: 9.5px; font-weight: 800; line-height: 14px; text-align: center; }
  .n-head { display: flex; align-items: center; gap: 10px; }
  .n-head b { font-size: 14px; font-weight: 600; }
  .n-head .back { height: 26px; padding: 0 11px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.06); color: #d4d4d8; font-size: 12px; }
  .n-head .back:hover { background: rgba(255,255,255,0.12); }
  .n-head .meta { margin-left: auto; font-size: 11.5px; color: #8b8b98; }
  .n-msgs { margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .n-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; max-height: 360px; overflow-y: auto; scrollbar-width: thin; }
  .n-col .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; color: #71717a; display: flex; align-items: center; gap: 8px; height: 22px; flex: none; }
  .n-col .lbl button { margin-left: auto; height: 22px; padding: 0 9px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.06); color: #d4d4d8; font-size: 11px; letter-spacing: 0; font-weight: 600; }
  .n-col .lbl button:hover { background: rgba(255,255,255,0.12); }
  .n-msg { border-radius: 14px; background: rgba(255,255,255,0.05); padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; text-align: left; border: 1px solid transparent; color: #e4e4e7; }
  .n-msg.top { border-color: rgba(251,191,36,0.35); background: rgba(251,191,36,0.08); }
  button.n-msg:hover { background: rgba(255,255,255,0.09); }
  .n-msg .hd { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .n-msg .hd .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .n-msg .hd b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .n-msg .hd .src { color: #8b8b98; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .n-msg .hd .tm { margin-left: auto; font-family: var(--mono); font-size: 11px; color: #71717a; flex: none; }
  .n-msg .bd { color: #d4d4d8; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .n-msg .ac { display: flex; gap: 6px; margin-top: 2px; flex-wrap: wrap; }
  .n-msg .ac button { height: 24px; padding: 0 10px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.1); color: #fff; font-size: 11.5px; font-weight: 600; }
  .n-msg .ac button.w { background: #fff; color: #000; }
  .n-msg .ac input { flex: 1 1 100%; height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.25); background: rgba(0,0,0,0.35); color: #fff; font-size: 12.5px; outline: none; user-select: text; }
  .n-empty { color: #71717a; font-size: 12.5px; padding: 6px 2px; }
  .fade { animation: fade 0.25s ease-out 0.15s both; }
  @keyframes fade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="n"></div>
<script type="module">
import { invoke, listen, onSnapshot, onTick, esc, icon, focusTiming, mmss, hhmm } from './shared.js';

const $ = (id) => document.getElementById(id);
const notch = $('n');
let s = null;
let stats = null;
let hotCount = 0;
let openState = false;
let view = 'main';           // 'main' | 'msgs' — co pokazuje rozwinięty notch
let hover = false;
let hoverTimer = null;
let leaveTimer = null;
let replying = false;
let msgShownId = '';
let msgTimer = null;
let msgHidden = '';          // wiadomość, którą notch już schował
let done = null;             // { until, kind, title }
const prevStatus = new Map();
let size = { w: 0, h: 0 };
let shrinkTimer = null;
let firstStep = { title: '', step: '' };
let lastKey = '';

const MAT = { bg: 'rgba(16,16,19,0.96)', edge: 'rgba(255,255,255,0.08)' };
const TINT = {
  music: { bg: 'linear-gradient(90deg, #4c1d95, #9d174d)', edge: 'rgba(244,114,182,0.4)' },
  msg: { bg: 'linear-gradient(90deg, #78350f, #a16207)', edge: 'rgba(251,191,36,0.45)' },
  meet: { bg: 'linear-gradient(90deg, #1e3a8a, #1d4ed8)', edge: 'rgba(96,165,250,0.5)' },
  hot: { bg: 'linear-gradient(90deg, #7f1d1d, #b91c1c)', edge: 'rgba(248,113,113,0.5)' },
  ontime: { bg: 'linear-gradient(90deg, #14532d, #15803d)', edge: 'rgba(74,222,128,0.45)' },
  early: { bg: 'linear-gradient(90deg, #3b0764, #7e22ce)', edge: 'rgba(192,132,252,0.45)' },
  late: { bg: 'linear-gradient(90deg, #713f12, #a16207)', edge: 'rgba(250,204,21,0.45)' },
};
const DONE = { early: ['#c084fc', 'Fioletowy sektor', 'ponad plan'], ontime: ['#4ade80', 'Zielony sektor', 'w czasie'], late: ['#facc15', 'Żółty sektor', 'po czasie'] };

// ------------------------------------------------------------------ stan

function meetingSoon() {
  const n = s?.next;
  if (!n || !['meeting', 'busy'].includes(n.kind)) return null;
  const mins = (new Date(n.start) - Date.now()) / 60000;
  return mins > 0 && mins <= 5 ? { title: n.title, mins: Math.ceil(mins) } : null;
}

function currentMsg() {
  const m = s?.radio?.current;
  return m && m.id !== msgHidden ? m : null;
}

const musicOn = () => s.spotifyEnabled && s.music.connected && s.music.title && s.music.playing;
const isHot = () => hotCount >= 2;

function stateOf() {
  if (!s) return 'rest';
  if (openState) return 'open';
  if (currentMsg()) return 'msg';
  if (done && Date.now() < done.until) return 'done';
  if (s.oneThing) return 'focus';
  if (meetingSoon()) return 'meet';
  if (isHot()) return 'hot';
  if (musicOn()) return 'music';
  return 'rest';
}

// ------------------------------------------------------------------ prawa strona: status + data

function wifiIcon(signal) {
  const on = (min) => (signal != null && signal >= min ? 1 : 0.3);
  return `<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M2 9a15 15 0 0 1 20 0" opacity="${on(75)}"></path><path d="M5 12.5a10 10 0 0 1 14 0" opacity="${on(45)}"></path>
    <path d="M8.5 16a5 5 0 0 1 7 0" opacity="${on(15)}"></path><path d="M12 19.5h.01" opacity="${signal == null ? 0.3 : 1}"></path></svg>`;
}

// Bateria jak w zasobniku Windows: „100%” i poziomy akumulator, z wtyczką przy ładowaniu.
function batteryIcon(pct, charging) {
  const p = Math.max(0, Math.min(100, pct)) / 100;
  const fill = !charging && pct <= 20 ? '#f87171' : 'currentColor';
  const plug = charging ? '<path d="M12.6 3.2 L9.2 7 H11.4 L10.6 9.8 L14 6 H11.8 Z" fill="#101013" stroke="#101013" stroke-width="0.6" stroke-linejoin="round"></path>' : '';
  return `<svg aria-hidden="true" width="26" height="13" viewBox="0 0 26 13" style="display:block">
    <rect x="0.75" y="0.75" width="21.5" height="11.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"></rect>
    <rect x="23.2" y="4" width="2" height="5" rx="1" fill="currentColor"></rect>
    <rect x="2.6" y="2.6" width="${(17.8 * p).toFixed(1)}" height="7.8" rx="1.6" fill="${fill}"></rect>${plug}</svg>`;
}

function statusHtml() {
  const st = stats || {};
  const parts = [];
  const unread = (s?.radio?.waiting || 0) + (s?.missed || []).length;
  parts.push(`<button class="n-sb n-bell" id="bellBtn" title="Powiadomienia i komunikaty${unread ? ` · ${unread} do przejrzenia` : ''}">${icon('bell', 15)}${unread ? `<span class="bd">${unread > 9 ? '9+' : unread}</span>` : ''}</button>`);
  parts.push(`<button class="n-sb" data-pop="wifi" title="${st.wifiSsid ? esc(st.wifiSsid) + ' · ' + st.wifiSignal + '%' : 'Wi‑Fi: brak połączenia'}">${wifiIcon(st.wifiSignal)}</button>`);
  if (st.volume != null) parts.push(`<button class="n-sb" id="vol" data-pop="sound" title="Dźwięk ${st.muted ? '— wyciszony' : st.volume + '%'} · kółko: głośność · środkowy klik: wycisz">${icon(st.muted ? 'mute' : 'volume', 16)}</button>`);
  if (st.btPresent && st.btConnected) parts.push(`<button class="n-sb" data-pop="bt" title="Bluetooth: ${st.btConnected} połączonych">${icon('bluetooth', 15)}</button>`);
  const bat = st.battery ?? s?.battery?.percent;
  const chg = st.battery != null ? st.charging : s?.battery?.charging;
  if (bat != null) parts.push(`<button class="n-sb" data-open="ms-settings:batterysaver" title="Bateria${chg ? ' · ładuje' : ''}">${bat}%${batteryIcon(bat, chg)}</button>`);
  return `<span class="n-st">${parts.join('')}</span>`;
}

function dateText() {
  return new Date().toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).replace(',', '');
}
const timeText = () => new Date().toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });

// ------------------------------------------------------------------ środek

function midHtml(st) {
  const t = focusTiming(s);
  if (st === 'msg') {
    const m = currentMsg();
    const canReply = !m.ask && (m.openTarget || m.replyUrl || m.reply);
    const btns = m.ask
      ? `<button class="n-act" id="mYes">${esc(m.yesLabel || 'Tak')}</button><button class="n-act g" id="mNo">${esc(m.noLabel || 'Nie')}</button>`
      : `${canReply ? '<button class="n-act" id="mReply">Odpowiedz</button>' : ''}${m.openTarget ? '<button class="n-act g" id="mOpen">Otwórz</button>' : ''}<button class="n-act g" id="mOk">OK</button>`;
    return `<span class="n-ic" style="background:#fbbf24;color:#1c1917">${esc(m.number || '!')}</span>
      <span class="t" id="msgText" title="Klik: wszystkie powiadomienia" style="cursor:pointer"><b style="color:#fde68a">${esc(m.name)}</b> <span class="dim">„${esc(m.message)}”</span></span>${btns}`;
  }
  if (st === 'done') {
    const [col, label, how] = DONE[done.kind];
    return `<span class="n-ic" style="background:${col};color:#0b0a0b">${icon('check', 12, 3)}</span>
      <span class="t"><b style="color:${col}">${label}</b> <span class="dim">· ${esc(done.title)} ${how}</span></span>`;
  }
  if (st === 'meet') {
    const m = meetingSoon();
    return `<span class="n-ic" style="background:#3b82f6;color:#fff">${icon('calendar', 12, 2.4)}</span>
      <span class="t"><b>${esc(m.title)}</b> <span class="dim">za ${m.mins} min</span></span>
      <button class="n-act" id="meetBtn">Kalendarz</button>`;
  }
  if (st === 'hot') {
    const st2 = stats || {};
    const what = st2.cpu >= 85 ? `CPU ${Math.round(st2.cpu)}%` : `RAM ${Math.round(st2.mem)}%`;
    const view = st2.cpu >= 85 ? 'cpu' : 'mem';
    return `<span class="n-ic" style="background:#ef4444;color:#fff">!</span>
      <span class="t"><b>${what}</b> <span class="dim">· system jest przeciążony</span></span>
      <button class="n-act" id="hotBtn" data-view="${view}">Pokaż</button>`;
  }
  if (st === 'music') {
    const m = s.music;
    return `<span class="n-art" style="background-image:url('${esc(m.art)}')"></span>
      <span class="t" id="mTitle" title="Klik: odtwarzacz na wierzchu"><b>${esc(m.title)}</b> <span class="dim">${esc(m.artist)}</span></span>
      <span class="n-eq"><i style="height:6px"></i><i style="height:13px"></i><i style="height:4px"></i><i style="height:10px"></i></span>
      <button class="n-tb" id="mPrev" title="Poprzedni">${icon('prev', 11)}</button>
      <button class="n-tb w" id="mPlay" title="Pauza">${icon('pause', 11)}</button>
      <button class="n-tb" id="mNext" title="Następny">${icon('next', 11)}</button>`;
  }
  if (st === 'focus') {
    return `<span class="c" id="cd">${t ? (s.paused ? 'pauza' : mmss(t.left)) : ''}</span>`;
  }
  // spoczynek / panel
  let text;
  let clock = '';
  if (s.focus) { text = esc(s.focus.title); clock = t ? (s.paused ? 'pauza' : mmss(t.left)) : ''; }
  else if (s.next) { text = `<span class="dim">Dalej:</span> ${esc(s.next.title)}`; clock = hhmm(s.next.start); }
  else text = '<span class="dim">Wolne</span>';
  // Liczba odłożonych wiadomości jest tylko na dzwonku (bez duplikatu w środku).
  return `<span class="t">${text}</span>${clock ? `<span class="c" id="cd">${esc(clock)}</span>` : ''}`;
}

// ------------------------------------------------------------------ rysowanie

function render() {
  if (!s) return;
  const st = stateOf();
  const focus = st === 'focus';
  const tint = st === 'done' ? TINT[done.kind] : TINT[st] || MAT;
  notch.style.setProperty('--bg', tint.bg);
  notch.style.setProperty('--edge', tint.edge);
  notch.style.setProperty('--accent', s.mode.accent);
  notch.style.setProperty('--modeBg', tint === MAT ? `${s.mode.accent}2e` : 'rgba(0,0,0,0.25)');
  notch.style.setProperty('--modeFg', tint === MAT ? '#fca5a5' : '#fff');

  const msg = st === 'msg' ? currentMsg() : null;
  const key = JSON.stringify([st, midKey(st), focus, replying, msg?.id, statusKey(), st === 'open' ? openKey() : '']);
  if (key !== lastKey) {
    lastKey = key;
    notch.innerHTML = `
      <div class="n-row" id="row">
        <span class="n-lead" id="lead">
          <button class="n-mode" id="modeBtn" title="Tryb: ${esc(s.mode.label)}"><i></i>${focus ? '' : esc(s.mode.label)}</button>
          <span class="n-mid" id="mid">${midHtml(st)}</span>
        </span>
        ${focus ? '' : statusHtml()}
        <button class="n-clock" id="clockBtn" title="Kalendarz">${focus ? '' : `<span id="date">${esc(dateText())}</span><span class="sep"></span>`}<span class="tm" id="time">${timeText()}</span></button>
      </div>
      ${msg && replying && st !== 'open' ? replyHtml(msg) : ''}
      ${st === 'open' ? panelHtml() : ''}`;
    wire(st, msg);
  } else {
    tickText(st);
  }
  const row = $('row');
  let w = Math.max(focus ? 150 : 260, Math.ceil(row.scrollWidth) + 2);
  let h = 40;
  if (msg && replying) h = 86;
  const r = st === 'open' ? 26 : 18;
  if (st === 'open') {
    w = Math.max(w, 942);
    h = 40 + ($('pn')?.offsetHeight || 300);
  }
  notch.style.borderRadius = `0 0 ${r}px ${r}px`;
  resize(w, h);
}

function midKey(st) {
  if (st === 'music') return [s.music.title, s.music.artist, s.music.art];
  if (st === 'rest' || st === 'open') return [s.focus?.title, !!focusTiming(s), s.paused, s.next?.title];
  if (st === 'meet') return meetingSoon()?.mins;
  if (st === 'hot') return [Math.round(stats?.cpu || 0), Math.round(stats?.mem || 0)];
  return '';
}
function statusKey() {
  const st = stats || {};
  return [(s?.radio?.waiting || 0) + (s?.missed || []).length, st.wifiSignal != null ? Math.floor(st.wifiSignal / 20) : -1, st.volume == null ? -1 : st.muted, st.btConnected, st.battery, st.charging, dateText()];
}

// Tylko teksty, które zmieniają się co sekundę (bez przerysowania notcha).
function tickText(st) {
  const tm = $('time');
  if (tm) tm.textContent = timeText();
  const cd = $('cd');
  const t = focusTiming(s);
  if (cd && s.focus && t) cd.textContent = s.paused ? 'pauza' : mmss(t.left);
  const bc = $('bigClock');
  if (bc && t) bc.textContent = mmss(t.left);
}

function replyHtml(m) {
  return `<div class="n-reply fade"><input id="rIn" placeholder="${m.replyUrl ? 'Odpowiedź — Enter wysyła' : 'Odpowiedź — Enter: do schowka i otwiera rozmowę'}" value="${esc(m.reply || '')}"><button class="n-act" id="rSend">Wyślij</button></div>`;
}

function openKey() {
  if (view === 'msgs') {
    const r = s.radio;
    return JSON.stringify(['msgs', (r.showingList || []).map((m) => m.id), (r.waitingList || []).map((m) => m.id), (s.missed || []).length, r.nextBatch, replying]);
  }
  return JSON.stringify([s.focus?.title, s.paused, s.oneThing, s.music.title, s.music.playing, (s.missed || []).length, s.next?.title, firstStep.step, s.mode.id, (s.presence || []).map((p) => p.state).join()]);
}

function peopleHtml() {
  const people = (s.presence || []).filter((p) => p.state !== 'offline').slice(0, 5);
  if (!people.length) return '';
  const color = { focus: '#f87171', available: '#4ade80', away: '#71717a' };
  const label = { focus: 'w fokusie', available: 'dostępny', away: 'z dala od komputera' };
  const working = people.filter((p) => p.state === 'focus').length;
  return `<span class="n-people">${working ? 'pracują teraz' : 'obecni'}${people.map((p) => {
    const initials = p.name.split(/\s+/).map((x) => x[0]).join('').slice(0, 2).toUpperCase();
    return `<span class="n-pp" style="--st:${color[p.state] || '#71717a'}" title="${esc(`${p.name} — ${label[p.state] || p.state}${p.task ? `: ${p.task}` : ''}`)}">${esc(initials)}</span>`;
  }).join('')}</span>`;
}

const ago = (iso) => (iso ? new Date(iso).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' }) : '');

function msgCard(m, opts = {}) {
  const color = esc(m.color || '#a1a1aa');
  const src = m.source || m.app || '';
  let actions = '';
  if (opts.current) {
    if (m.ask) {
      actions = `<button class="w" id="lYes">${esc(m.yesLabel || 'Tak')}</button><button id="lNo">${esc(m.noLabel || 'Nie')}</button>`;
    } else {
      const canReply = m.openTarget || m.replyUrl || m.reply;
      actions = `${canReply ? '<button class="w" id="lReply">Odpowiedz</button>' : ''}${m.openTarget ? '<button id="lOpen">Otwórz</button>' : ''}<button id="lOk">OK</button>`;
      if (replying) actions += `<input id="rIn" placeholder="${m.replyUrl ? 'Odpowiedź — Enter wysyła' : 'Odpowiedź — Enter: do schowka i otwiera rozmowę'}" value="${esc(m.reply || '')}">`;
    }
  } else if (opts.missed != null && m.openTarget) {
    actions = `<button data-miss="${opts.missed}">Otwórz</button>`;
  }
  const tag = opts.missed != null && !m.openTarget ? 'div' : 'div';
  return `<${tag} class="n-msg${opts.current ? ' top' : ''}">
    <span class="hd"><span class="dot" style="background:${color}"></span><b style="color:${color}">${esc(m.name)}</b>${src ? `<span class="src">· ${esc(src)}</span>` : ''}<span class="tm">${ago(m.at)}</span></span>
    <span class="bd">${esc(m.message)}</span>
    ${actions ? `<span class="ac">${actions}</span>` : ''}</${tag}>`;
}

function msgsHtml() {
  const r = s.radio;
  const showing = r.showingList || [];
  const waiting = r.waitingList || [];
  const missed = s.missed || [];
  const notif = r.notifications;
  const meta = notif && notif !== 'ok' && typeof notif === 'string' ? `Powiadomienia Windows: ${esc(notif)}` : r.nextBatch ? `Następna paczka o ${esc(r.nextBatch)}` : '';
  return `<div class="n-pn" id="pn">
    <div class="n-head fade"><button class="back" id="backBtn">← Panel</button><b>Powiadomienia i komunikaty</b><span class="meta">${meta}</span></div>
    <div class="n-msgs fade">
      <div class="n-col"><span class="lbl">TERAZ${showing.length > 1 ? ` · ${showing.length}` : ''}</span>
        ${showing.map((m, i) => msgCard(m, { current: i === 0 })).join('') || '<span class="n-empty">Nic nie czeka na odpowiedź.</span>'}
      </div>
      <div class="n-col"><span class="lbl">CZEKA NA PACZKĘ${r.waiting ? ` · ${r.waiting}` : ''}${r.waiting ? '<button id="releaseBtn">Pokaż teraz</button>' : ''}</span>
        ${waiting.map((m) => msgCard(m)).join('') || '<span class="n-empty">Pusto — nic nie jest odłożone.</span>'}
      </div>
      <div class="n-col"><span class="lbl">CO PRZEGAPIŁEŚ${missed.length ? ` · ${missed.length}<button id="clrMissed">Wyczyść</button>` : ''}</span>
        ${missed.map((m, i) => msgCard(m, { missed: i })).join('') || '<span class="n-empty">Nic — jesteś na bieżąco.</span>'}
      </div>
    </div></div>`;
}

function panelHtml() {
  if (view === 'msgs') return msgsHtml();
  const t = focusTiming(s);
  const acc = s.mode.accent;
  let main;
  if (s.focus) {
    const p = t ? t.progress * 100 : 0;
    main = `<div class="n-card fade" style="background:linear-gradient(160deg, ${acc}33, rgba(255,255,255,0.03))">
      <span class="n-ring" style="background:conic-gradient(${acc} 0 ${p}%, rgba(255,255,255,0.08) 0)"><span id="bigClock">${t ? mmss(t.left) : ''}</span></span>
      <span style="display:flex;flex-direction:column;gap:7px;min-width:0">
        <span class="n-kick" style="color:#fca5a5">TERAZ${s.focus.end ? ` · DO ${hhmm(s.focus.end)}` : ''}</span>
        <b style="font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis">${esc(s.focus.title)}</b>
        ${firstStep.step && firstStep.title === s.focus.title ? `<span style="font-size:12.5px;color:#d4d4d8">Pierwszy krok: ${esc(firstStep.step)}</span>` : ''}
        <span style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">
          ${s.focus.completable ? '<button class="n-b2 w" id="pDone">✓ Skończone</button>' : ''}
          <button class="n-b2" id="pPause">${s.paused ? 'Wznów' : 'Pauza'}</button>
          <button class="n-b2" id="pOne">${s.oneThing ? 'Pokaż wszystko' : 'Jedna rzecz'}</button>
        </span>
      </span></div>`;
  } else if (s.spotifyEnabled && s.music.connected && s.music.title) {
    main = `<div class="n-card fade" style="flex-direction:column;align-items:stretch;justify-content:space-between;background:linear-gradient(160deg, rgba(76,29,149,0.9), rgba(157,23,77,0.75))">
      <span style="display:flex;gap:14px;align-items:center"><span style="width:70px;height:70px;border-radius:14px;flex:none;background:#222 url('${esc(s.music.art)}') center/cover"></span>
        <span style="display:flex;flex-direction:column;gap:3px;min-width:0"><b style="font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.music.title)}</b><span style="font-size:13px;color:rgba(255,255,255,0.75)">${esc(s.music.artist)}</span></span></span>
      <span style="display:flex;justify-content:center;gap:30px;align-items:center">
        <button class="n-b2" id="pPrev">${icon('prev', 14)}</button>
        <button class="n-b2 w" id="pPlay" style="width:44px;height:44px;border-radius:50%;padding:0">${icon(s.music.playing ? 'pause' : 'play', 16)}</button>
        <button class="n-b2" id="pNext">${icon('next', 14)}</button></span></div>`;
  } else {
    main = `<div class="n-card fade" style="background:rgba(255,255,255,0.03);flex-direction:column;align-items:flex-start;justify-content:center;gap:10px">
      <span class="n-kick" style="color:#71717a">TERAZ NIC NIE TRWA</span>
      <b style="font-size:17px;font-weight:600">${s.next ? `Dalej: ${esc(s.next.title)} o ${hhmm(s.next.start)}` : 'Na dziś nic więcej w planie'}</b>
      <span style="display:flex;gap:6px"><button class="n-b2 w" id="pStart">Start fokusu</button><button class="n-b2" id="pReplan">Przeplanuj</button></span></div>`;
  }
  const upcoming = (s.day || []).filter((i) => i.status === 'next' && i.kind !== 'buffer').slice(0, 2);
  const missed = (s.missed || []).slice(0, 3);
  const modes = (s.modes || []).map((m) => {
    const on = m.id === s.mode.id;
    return `<button data-mode="${esc(m.id)}" style="${on ? `background:${m.accent}40;color:#fff` : ''}">${esc(m.label)}</button>`;
  }).join('');
  return `<div class="n-pn" id="pn">
    <div class="n-modes fade">${modes}${peopleHtml()}</div>
    <div class="n-grid">${main}
      <div class="n-side fade">
        <div class="n-box"><span class="lbl">DALEJ</span>
          ${upcoming.map((i) => `<span class="n-it"><span class="tm">${hhmm(i.start)}</span><span class="tx">${esc(i.title)}</span></span>`).join('') || '<span class="n-it" style="color:#71717a">nic więcej dziś</span>'}
        </div>
        <div class="n-box"><span class="lbl">CO PRZEGAPIŁEŚ<button id="allMsgs" style="margin-left:auto;border:0;background:transparent;color:#a1a1aa;font-size:10.5px;font-weight:700;letter-spacing:0.05em">WSZYSTKIE →</button></span>
          ${missed.map((m, i) => `<button class="n-it" data-miss="${i}" title="${esc(m.message)}"><span class="dot" style="background:${esc(m.color)}"></span><span class="tx"><b style="color:${esc(m.color)}">${esc(m.name)}</b> ${esc(m.message)}</span>${m.openTarget ? '<b>Otwórz</b>' : ''}</button>`).join('') || '<span class="n-it" style="color:#71717a">nic — jesteś na bieżąco</span>'}
        </div>
        <div class="n-quick">
          <button class="n-q" id="qCap" title="Wrzuć myśl">${icon('note', 16)}</button>
          <button class="n-q" id="qOne" title="Jedna rzecz">${icon('layers', 16)}</button>
          <button class="n-q" id="qShot" title="Zrzut ekranu">${icon('camera', 16)}</button>
          <button class="n-q" id="qReplan" title="Przeplanuj">${icon('replan', 16)}</button>
        </div>
        <div class="n-deep">
          <button id="dMusic">${icon('music', 13)} Muzyka i kolejka</button>
          <button id="dShelf">${icon('clipboard', 13)} Półka i schowek</button>
          <button id="dCal">${icon('calendar', 13)} Kalendarz</button>
          <button id="dSys">${icon('cpu', 13)} System</button>
        </div>
      </div>
    </div></div>`;
}

function popup(view, el) {
  const r = el.getBoundingClientRect();
  invoke('popup_open', { view, from: 'notch', x: r.left, y: r.top, w: r.width, h: r.height });
}

function wire(st, msg) {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = (e) => { e.stopPropagation(); fn(e); }; };
  on('modeBtn', () => setOpen(!openState));
  on('clockBtn', () => invoke('toggle_calendar'));
  on('waitBtn', () => showMsgs());
  on('bellBtn', () => (openState && view === 'msgs' ? setOpen(false) : showMsgs()));
  on('msgText', () => showMsgs());
  on('meetBtn', () => invoke('toggle_calendar'));
  on('hotBtn', (e) => popup(e.currentTarget.dataset.view, e.currentTarget));
  on('mTitle', () => invoke('player_toggle'));
  on('mPrev', () => invoke('spotify_control', { action: 'previous' }));
  on('mNext', () => invoke('spotify_control', { action: 'next' }));
  on('mPlay', () => invoke('spotify_control', { action: 'pause' }));
  for (const b of notch.querySelectorAll('[data-pop]')) b.onclick = (e) => { e.stopPropagation(); popup(b.dataset.pop, b); };
  for (const b of notch.querySelectorAll('[data-open]')) b.onclick = (e) => { e.stopPropagation(); invoke('open_path', { path: b.dataset.open }); };
  const vol = $('vol');
  if (vol) {
    vol.onauxclick = (e) => { if (e.button === 1) invoke('toggle_mute'); };
    vol.onwheel = (e) => {
      e.preventDefault();
      const next = Math.max(0, Math.min(100, (stats?.volume || 0) + (e.deltaY < 0 ? 2 : -2)));
      if (stats) { stats.volume = next; stats.muted = false; }
      invoke('set_volume', { level: next });
    };
  }
  // Środek otwiera panel (klik albo chwila najechania); ikony i zegar — nie, żeby nic nie uciekało spod kursora.
  const mid = $('mid');
  if (mid && st !== 'msg') {
    mid.onclick = () => setOpen(!openState);
    mid.onmouseenter = () => { if (!openState) { clearTimeout(hoverTimer); hoverTimer = setTimeout(() => setOpen(true), 420); } };
    mid.onmouseleave = () => clearTimeout(hoverTimer);
  }
  if (msg) {
    on('mYes', () => invoke('automation_answer', { yes: true }));
    on('mNo', () => invoke('automation_answer', { yes: false }));
    on('mOk', () => { replying = false; invoke('radio_next'); });
    on('mOpen', () => invoke('radio_open'));
    on('mReply', () => { replying = true; clearTimeout(msgTimer); invoke('notch_focus'); lastKey = ''; render(); setTimeout(() => $('rIn')?.focus(), 60); });
    const input = $('rIn');
    if (input) {
      const send = async () => {
        const text = input.value.trim();
        if (!text) return;
        try { await invoke('radio_quick_reply', { text }); replying = false; if (msg.replyUrl) invoke('radio_next'); lastKey = ''; render(); }
        catch (err) { input.value = ''; input.placeholder = String(err); }
      };
      input.onkeydown = (e) => { if (e.key === 'Enter') send(); if (e.key === 'Escape') { replying = false; lastKey = ''; render(); } };
      on('rSend', send);
    }
  }
  if (st === 'open' && view === 'msgs') {
    const cur = (s.radio.showingList || [])[0];
    on('backBtn', () => { view = 'main'; replying = false; render(); });
    on('releaseBtn', () => invoke('radio_show_waiting'));
    on('clrMissed', () => invoke('notch_clear_missed', { index: null }));
    on('lYes', () => invoke('automation_answer', { yes: true }));
    on('lNo', () => invoke('automation_answer', { yes: false }));
    on('lOk', () => { replying = false; invoke('radio_next'); });
    on('lOpen', () => invoke('radio_open'));
    on('lReply', () => { replying = true; invoke('notch_focus'); lastKey = ''; render(); setTimeout(() => $('rIn')?.focus(), 60); });
    const input = $('rIn');
    if (input && cur) {
      input.onclick = (e) => e.stopPropagation();
      input.onkeydown = async (e) => {
        if (e.key === 'Escape') { replying = false; lastKey = ''; render(); return; }
        if (e.key !== 'Enter') return;
        const text = input.value.trim();
        if (!text) return;
        try { await invoke('radio_quick_reply', { text }); replying = false; if (cur.replyUrl) invoke('radio_next'); lastKey = ''; render(); }
        catch (err) { input.value = ''; input.placeholder = String(err); }
      };
    }
    for (const b of notch.querySelectorAll('[data-miss]')) b.onclick = (e) => { e.stopPropagation(); invoke('notch_open_missed', { index: +b.dataset.miss }); };
  } else if (st === 'open') {
    on('allMsgs', () => showMsgs());
    on('pDone', () => invoke('focus_finish'));
    on('pPause', () => invoke('focus_toggle_pause'));
    on('pOne', () => invoke('one_thing_toggle'));
    on('pStart', () => invoke('focus_start_adhoc', {}));
    on('pReplan', () => invoke('replan'));
    on('pPrev', () => invoke('spotify_control', { action: 'previous' }));
    on('pNext', () => invoke('spotify_control', { action: 'next' }));
    on('pPlay', () => invoke('spotify_control', { action: s.music.playing ? 'pause' : 'play' }));
    on('qCap', () => invoke('show_capture'));
    on('qOne', () => invoke('one_thing_toggle'));
    on('qShot', () => { setOpen(false); setTimeout(() => invoke('shot_start'), 300); });
    on('qReplan', () => invoke('replan'));
    on('dMusic', () => { setOpen(false); invoke('player_toggle'); });
    on('dShelf', () => { setOpen(false); invoke('notch_drawer', { view: 'clip' }); });
    on('dCal', () => { setOpen(false); invoke('toggle_calendar'); });
    on('dSys', (e) => popup('cpu', e.currentTarget));
    on('clrMissed', () => invoke('notch_clear_missed', { index: null }));
    for (const b of notch.querySelectorAll('[data-miss]')) b.onclick = (e) => { e.stopPropagation(); invoke('notch_open_missed', { index: +b.dataset.miss }); };
    for (const b of notch.querySelectorAll('[data-mode]')) b.onclick = (e) => { e.stopPropagation(); invoke('set_mode', { id: b.dataset.mode }); };
    if (s.focus && firstStep.title !== s.focus.title) {
      const title = s.focus.title;
      invoke('get_first_step', { title }).then((step) => { firstStep = { title, step: step || '' }; lastKey = ''; render(); });
    }
  }
}

// Okno rośnie przed animacją i kurczy się po niej (przezroczysta część okna łapie kliknięcia).
function resize(w, h) {
  const outer = { w: w + 32, h: h + 18 };
  notch.style.width = `${w}px`;
  notch.style.height = `${h}px`;
  if (outer.w === size.w && outer.h === size.h) return;
  const grow = outer.w > size.w || outer.h > size.h;
  clearTimeout(shrinkTimer);
  const apply = () => { size = outer; invoke('notch_size', { width: outer.w, height: outer.h }); };
  if (grow || !size.w) apply();
  else shrinkTimer = setTimeout(apply, 470);
}

function setOpen(v) {
  clearTimeout(hoverTimer);
  if (!v) { view = 'main'; }
  if (openState === v) return;
  openState = v;
  if (v) clearTimeout(msgTimer);
  render();
}

function showMsgs() {
  clearTimeout(hoverTimer);
  clearTimeout(msgTimer);
  view = 'msgs';
  openState = true;
  lastKey = '';
  render();
}

// ------------------------------------------------------------------ zdarzenia

document.addEventListener('mouseenter', () => { hover = true; clearTimeout(leaveTimer); clearTimeout(msgTimer); });
document.addEventListener('mouseleave', () => {
  hover = false;
  clearTimeout(hoverTimer);
  if (document.activeElement?.tagName === 'INPUT') return;
  leaveTimer = setTimeout(() => { if (openState) setOpen(false); armMsgTimer(true); }, 420);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && openState) setOpen(false); });

// Wiadomość: widać ją ~6 s, potem ląduje w „Co przegapiłeś” (chyba że to pytanie albo kursor jest nad nią).
function armMsgTimer(force) {
  const m = s?.radio?.current;
  if (!m || m.ask) return;
  if (m.id === msgShownId && !force) return;
  msgShownId = m.id;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => {
    if (hover || replying) return;
    msgHidden = m.id;
    invoke('notch_missed');
    render();
  }, 6000);
}

function trackDone() {
  for (const i of s.day || []) {
    const before = prevStatus.get(i.key);
    if (before && before !== i.status && DONE[i.status]) {
      done = { until: Date.now() + 4000, kind: i.status, title: i.title };
      setTimeout(render, 4100);
    }
    prevStatus.set(i.key, i.status);
  }
}

listen('stats', (st) => {
  stats = st;
  hotCount = (st.cpu ?? 0) >= 85 || (st.mem ?? 0) >= 90 ? hotCount + 1 : 0;
  render();
});
invoke('get_stats').then((st) => { stats = st; render(); });

onSnapshot((snap) => {
  s = snap;
  trackDone();
  if (s.radio.current && s.radio.current.id !== msgHidden) armMsgTimer(false);
  if (!s.radio.current) replying = false;
  render();
});
onTick((snap) => { s = snap; render(); });
listen('notch-wake', () => render());
listen('notch-layout', () => { size = { w: 0, h: 0 }; render(); });
</script>
</body>
</html>
