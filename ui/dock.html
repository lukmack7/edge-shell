<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Edge Shell — dock</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { display: flex; align-items: flex-end; justify-content: center; }
  nav { display: inline-flex; align-items: flex-end; gap: 8px; padding: 10px 10px 7px; margin-bottom: 4px; border-radius: 22px; background: rgba(16,16,19,0.86); border: 1px solid var(--line); }
  .app { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 0; border: 0; background: transparent; transition: transform 0.12s ease; }
  .app:hover { transform: translateY(-3px); }
  .tile { width: 52px; height: 52px; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
  .tile.real { background: transparent !important; }
  .tile img { width: 44px; height: 44px; object-fit: contain; image-rendering: auto; }
  .stripe { width: 28px; height: 3px; border-radius: 2px; }
  .app.dim { opacity: 0.35; filter: grayscale(1); }
  .app.unpinned .stripe { width: 6px; border-radius: 50%; height: 4px; }
  .app.dim .stripe { background: transparent !important; }
  .dots { position: absolute; top: -4px; right: -2px; display: flex; gap: 2px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px #18181b; }
  .badge.muted { min-width: 10px; width: 10px; height: 10px; padding: 0; top: -2px; right: -2px; background: #71717a; }
  .badge { position: absolute; top: -5px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #ef4444; color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; box-shadow: 0 0 0 2px #18181b; }
  .app.stack .tile.real img { width: 46px; height: 46px; }
  @keyframes reveal { from { transform: translateY(70%); opacity: 0.4; } to { transform: none; opacity: 1; } }
  nav.reveal { animation: reveal 0.14s ease-out; }
  .app.dragging { opacity: 0.55; transform: translateY(-8px) scale(1.06); transition: none; }
  .app.drop-target .tile { outline: 2px solid #fbbf24; outline-offset: 3px; }
  nav.drop-add { outline: 2px dashed rgba(251,191,36,0.7); outline-offset: -3px; }
  /* Karty okien: otwarta aplikacja pokazuje tytuł okna obok ikony. */
  .app.card { flex-direction: row; align-items: center; gap: 10px; padding: 0 12px 0 0; border-radius: 15px; background: rgba(255,255,255,0.05); height: 52px; margin-bottom: 8px; }
  .app.card.active { background: rgba(255,255,255,0.11); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16); }
  .app.card .stripe { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); }
  .app.card .lbl { display: flex; flex-direction: column; gap: 2px; min-width: 0; max-width: 150px; text-align: left; }
  .app.card .lbl b { font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app.card .lbl span { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .app.card:hover { transform: none; background: rgba(255,255,255,0.1); }
  .app.active .stripe { width: 22px !important; background: #f4f4f5 !important; }
  .app .tile, .app.card .tile { transition: transform 0.16s cubic-bezier(.2,.9,.3,1.3); transform-origin: 50% 100%; }
  .sep { width: 1px; height: 34px; margin-bottom: 14px; background: rgba(255,255,255,0.12); }
  /* Widgety: żywe kafle obok ikon (blok, fokus, radio, pogoda, muzyka, odliczanie). */
  /* Widgety są kafelkami tej samej siatki co aplikacje — każdy ma własny „charakter”. */
  .app.wgt { width: 52px; height: 52px; padding: 0; border-radius: 15px; background: transparent; }
  .app.wgt:hover { transform: translateY(-3px); }
  .w-face { --t1: rgba(255,255,255,0.1); --t2: rgba(255,255,255,0.04); --edge: rgba(255,255,255,0.1); --fg: #e4e4e7;
    position: relative; width: 52px; height: 52px; border-radius: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: linear-gradient(145deg, var(--t1), var(--t2)); border: 1px solid var(--edge); color: var(--fg); }
  .w-face.tone-sky { --t1: rgba(14,116,224,0.8); --t2: rgba(56,189,248,0.4); --edge: rgba(125,211,252,0.5); --fg: #fff; }
  .w-face.tone-night { --t1: rgba(30,58,138,0.95); --t2: rgba(15,23,42,0.9); --edge: rgba(96,165,250,0.4); --fg: #dbeafe; }
  .w-face.tone-amber { --t1: rgba(217,119,6,0.55); --t2: rgba(120,53,15,0.4); --edge: rgba(251,191,36,0.45); --fg: #fde68a; }
  .w-face.tone-red { --t1: rgba(185,28,28,0.6); --t2: rgba(69,10,10,0.5); --edge: rgba(248,113,113,0.5); --fg: #fecaca; }
  .w-face.tone-rose { --t1: rgba(190,24,93,0.65); --t2: rgba(80,7,36,0.5); --edge: rgba(244,114,182,0.5); --fg: #fbcfe8; }
  .w-face.tone-green { --t1: rgba(21,128,61,0.55); --t2: rgba(5,46,22,0.4); --edge: rgba(74,222,128,0.45); --fg: #bbf7d0; }
  .w-face.tone-violet { --t1: rgba(109,40,217,0.65); --t2: rgba(157,23,77,0.5); --edge: rgba(192,132,252,0.5); --fg: #fff; }
  .w-symbol { font-size: 25px; line-height: 1; margin-top: -7px; }
  .w-glyph { display: flex; margin-top: -2px; }
  .w-face:has(.w-chip) .w-glyph { margin-top: -9px; }
  .w-ring ~ .w-glyph svg { width: 18px; height: 18px; }
  .w-chip { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 11px; font-weight: 800; line-height: 13px; letter-spacing: 0.2px; color: var(--fg); text-shadow: 0 1px 3px rgba(0,0,0,0.45); }
  .w-art { position: absolute; inset: 0; background: center/cover; }
  .w-art + .w-glyph { position: relative; padding: 6px; border-radius: 50%; background: rgba(0,0,0,0.5); margin: 0; }
  .w-eq { position: absolute; left: 0; right: 0; bottom: 5px; display: flex; justify-content: center; align-items: flex-end; gap: 2px; height: 12px; }
  .w-eq i { width: 3px; border-radius: 2px; background: #fff; box-shadow: 0 0 4px rgba(0,0,0,0.5); animation: eq 0.9s ease-in-out infinite; }
  .w-eq i:nth-child(2) { animation-delay: -0.3s; } .w-eq i:nth-child(3) { animation-delay: -0.6s; } .w-eq i:nth-child(4) { animation-delay: -0.15s; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }
  .w-ring { position: absolute; top: 4px; left: 9px; width: 34px; height: 34px; border-radius: 50%; background: conic-gradient(#f87171 calc(var(--p) * 1%), rgba(255,255,255,0.12) 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); }
  .w-face.pulse { animation: wpulse 2.4s ease-in-out infinite; }
  @keyframes wpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(248,113,113,0); } 50% { box-shadow: 0 0 12px 1px rgba(248,113,113,0.35); } }
  .app.wgt .stripe { position: absolute; left: 15px; bottom: -1px; width: 22px; }
</style>
</head>
<body>
<nav id="dock" aria-label="Dock"></nav>
<script type="module">
import { invoke, listen, onSnapshot, esc, icon } from './shared.js';

const dock = document.getElementById('dock');
let lastKey = '';
let icons = {};
let snap = null;
let hoverTimer = null;
const { emitTo } = window.__TAURI__.event;

async function loadIcons() {
  icons = await invoke('dock_icons').catch(() => ({}));
  lastKey = '';
  if (snap) render(snap);
}
listen('config-changed', loadIcons);
loadIcons();

// Ikony otwartych aplikacji spoza docka (z pliku .exe), pobierane raz.
const runIcons = {};
function runIcon(a) {
  if (!(a.id in runIcons)) {
    runIcons[a.id] = null;
    invoke('app_icon', { path: a.path }).then((url) => {
      runIcons[a.id] = url;
      if (url) { lastKey = ''; if (snap) render(snap); }
    }).catch(() => {});
  }
  return runIcons[a.id];
}

function tile(a) {
  if (a.unpinned) {
    const url = runIcon(a);
    if (url) return `<span class="tile real"><img src="${url}" alt=""></span>`;
    return `<span class="tile" style="background:${a.bg};color:${a.fg};font-weight:700;font-size:18px">${esc((a.name || '?')[0].toUpperCase())}</span>`;
  }
  if (a.icon === 'auto' && icons[a.id]) {
    return `<span class="tile real"><img src="${icons[a.id]}" alt=""></span>`;
  }
  const builtin = a.icon === 'auto' ? a.name : a.icon || a.name;
  return `<span class="tile" style="background:${a.bg};color:${a.fg}">${icon(builtin, 24)}</span>`;
}

onSnapshot((s) => { snap = s; render(s); });

// Lekkie powiększenie pod kursorem (najbliższa ikona 1.14, sąsiednie trochę mniej).
dock.addEventListener('mousemove', (e) => {
  if (dragging) return;
  for (const b of dock.querySelectorAll('.app')) {
    const t = b.querySelector('.tile');
    if (!t) continue;
    const r = t.getBoundingClientRect();
    const d = Math.abs(e.clientX - (r.left + r.width / 2));
    const k = Math.max(0, 1 - d / 120);
    t.style.transform = `scale(${1 + 0.14 * k * k})`;
  }
});
dock.addEventListener('mouseleave', () => {
  for (const t of dock.querySelectorAll('.tile')) t.style.transform = '';
});

// Upuszczanie plików z Eksploratora: na ikonę = otwórz w tej aplikacji
// (na stos = skopiuj do folderu), na pusty fragment docka = przypnij.
const webview = window.__TAURI__.webview.getCurrentWebview();
function dropTarget(pos) {
  const r = window.devicePixelRatio || 1;
  const el = document.elementFromPoint(pos.x / r, pos.y / r);
  const app = el ? el.closest('.app') : null;
  return app && !app.dataset.widget ? app : null;
}
function clearDrop() {
  for (const x of dock.querySelectorAll('.drop-target')) x.classList.remove('drop-target');
  dock.classList.remove('drop-add');
}
webview.onDragDropEvent((ev) => {
  const p = ev.payload;
  if (p.type === 'over' || p.type === 'enter') {
    clearDrop();
    const t = p.position && dropTarget(p.position);
    if (t) t.classList.add('drop-target'); else dock.classList.add('drop-add');
    // Podpis: co się stanie po upuszczeniu.
    const label = t
      ? (t.dataset.stack === '1' ? `Skopiuj do: ${t.dataset.name}` : `Otwórz w: ${t.dataset.name}`)
      : 'Przypnij do docka';
    const r = (t || dock).getBoundingClientRect();
    if (label !== lastDropLabel) { lastDropLabel = label; invoke('previews_tip', { text: label, anchor: r.left + r.width / 2 }); }
  } else if (p.type === 'drop') {
    const t = p.position && dropTarget(p.position);
    clearDrop();
    lastDropLabel = '';
    invoke('previews_hide');
    if (!p.paths?.length) return;
    if (t) invoke('dock_open_with', { id: t.dataset.id, paths: p.paths }).catch((err) => console.warn(err));
    else invoke('dock_add_paths', { paths: p.paths }).catch((err) => console.warn(err));
  } else {
    clearDrop();
    lastDropLabel = '';
    invoke('previews_hide');
  }
});
let lastDropLabel = '';
// Wysunięcie docka (autoukrywanie): krótki wjazd od dołu.
listen('dock-reveal', () => {
  dock.classList.remove('reveal');
  void dock.offsetWidth;
  dock.classList.add('reveal');
});

let dragging = null;
let suppressClick = false;

/** Karty z tytułem okna, gdy jest miejsce; przy tłoku wszystko wraca do ikon. */
function cardsFor(s) {
  const withWin = s.dock.filter((a) => a.windows > 0 && !a.widget);
  const widgets = s.dock.filter((a) => a.widget).length;
  const maxW = (screen.availWidth || 1920) * 0.78;
  const est = (s.dock.length - widgets) * 60 + widgets * 60 + withWin.length * 150;
  return withWin.length <= 7 && est < maxW;
}
function cardLabel(s, a) {
  const titles = (s.windowTitles || {})[a.exe] || [];
  if (a.windows > 1) return { title: a.name, sub: `${a.windows} okna` };
  const t = titles[0] || a.name;
  // „Dokument — Aplikacja” → sam dokument; nazwa aplikacji jest w ikonie.
  const short = t.replace(/\s+[-—–|]\s+[^-—–|]+$/, '') || t;
  return { title: short, sub: short === t ? '' : a.name };
}

// --- Widgety -------------------------------------------------------------
const fmtClock = (d) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
const humanDur = (ms) => {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60), d = Math.floor(h / 24);
  return d >= 1 ? `${d} dni ${h % 24} h` : `${h} h ${String(m % 60).padStart(2, '0')} min`;
};

/** Wartości logiczne nigdy nie są tekstem UI. */
const text = (value) => (value === false || value == null ? '' : String(value));

/** Krótki czas na kafelek: 12m, 2h05, 3d. */
function shortDur(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h${String(m % 60).padStart(2, '0')}`;
  return `${Math.floor(h / 24)}d`;
}

/**
 * Dane widgetu: { ic|emoji, chip, tone, ring?, art?, eq?, pulse?, label, count? }.
 * Kafelek jest kwadratowy jak ikona; szczegóły są po kliknięciu.
 */
function widgetData(a, s) {
  const quiet = s.quietUntil ? new Date(s.quietUntil) : null;
  switch (a.widget) {
    case 'next-block': {
      const n = s.next;
      if (!n) return { ic: 'check', chip: 'wolne', tone: 'green', label: 'Plan na dziś: koniec listy' };
      const left = new Date(n.start) - Date.now();
      return { ic: 'clock', chip: left > 0 && left < 3600000 ? shortDur(left) : fmtClock(new Date(n.start)), tone: 'amber', label: `Następny blok: ${n.title}` };
    }
    case 'focus': {
      const f = s.focus;
      if (!f) return { ic: 'clock', chip: 'start', tone: 'slate', label: 'Fokus: nie trwa' };
      const start = new Date(f.start), end = new Date(f.end);
      const ring = Math.max(0, Math.min(1, (Date.now() - start) / Math.max(1, end - start)));
      return { ic: 'clock', chip: shortDur(end - Date.now()), tone: 'red', ring, pulse: !s.paused, count: f.end, label: `Fokus: ${f.title}` };
    }
    case 'radio': {
      const w = s.radio ? s.radio.waiting : 0;
      if (w) return { ic: 'radio', chip: String(w), tone: 'rose', pulse: true, label: `Radio: ${w} czeka` };
      if (quiet) return { ic: 'moon', chip: fmtClock(quiet), tone: 'slate', label: 'Radio wyciszone' };
      return { ic: 'radio', chip: '', tone: 'slate', label: 'Radio: cisza' };
    }
    case 'weather': {
      const w = s.weather;
      if (!w) return { ic: 'globe', chip: '', tone: 'sky', label: 'Pogoda: pobieram dane' };
      const hh = +String(s.clock || '12:00').split(':')[0];
      return { emoji: w.emoji, chip: `${Math.round(w.temp)}°`, tone: hh >= 19 || hh < 6 ? 'night' : 'sky', label: `Pogoda: ${Math.round(w.temp)}°, ${w.text}` };
    }
    case 'music': {
      const m = s.music;
      if (m && m.connected && m.title) return { ic: m.playing ? 'music' : 'pause', chip: '', tone: 'violet', art: m.art, eq: !!m.playing, label: `${m.playing ? 'Gra' : 'Pauza'}: ${m.title} — ${m.artist}` };
      return { ic: 'music', chip: '', tone: 'violet', label: 'Muzyka: niepołączona' };
    }
    case 'countdown': {
      const [label, when] = (a.widgetTarget || '').split('|');
      const end = new Date(when || '');
      if (isNaN(end)) return { ic: 'calendar', chip: '?', tone: 'slate', label: 'Odliczanie: ustaw cel w Dock → widgetTarget' };
      return { ic: 'calendar', chip: shortDur(end - Date.now()), tone: 'amber', count: end.toISOString(), label: `${label || 'Odliczanie'}` };
    }
    default: return { ic: 'clock', chip: '', tone: 'slate', label: a.name };
  }
}

/** Widgety są kwadratowe jak ikony; szczegóły są po kliknięciu w panelu/notce. */
const widgetTile = (w) => {
  const art = w.art ? `<span class="w-art" style="background-image:url('${esc(text(w.art))}')"></span>` : '';
  const ring = w.ring != null ? `<span class="w-ring" style="--p:${Math.round(w.ring * 100)}"></span>` : '';
  const sym = w.emoji ? `<span class="w-symbol" aria-hidden="true">${esc(text(w.emoji))}</span>` : `<span class="w-glyph">${icon(text(w.ic), 22)}</span>`;
  const eq = w.eq ? '<span class="w-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>' : '';
  const chip = w.chip ? `<span class="w-chip">${esc(text(w.chip))}</span>` : '';
  return `<span class="w-face tone-${w.tone}${w.pulse ? ' pulse' : ''}">${art}${ring}${sym}${eq}${chip}</span>`;
};

/** Klik w widget: radio → czekające, muzyka → play/pauza, pogoda → prognoza w notce, reszta → panel Teraz. */
function widgetClick(a) {
  invoke('previews_hide');
  if (a.widget === 'radio') { invoke('radio_show_waiting').catch((err) => console.warn(err)); return; }
  if (a.widget === 'music') { invoke('player_toggle').catch((err) => console.warn(err)); return; }
  if (a.widget === 'weather') { invoke('weather_show').catch((err) => console.warn(err)); return; }
  invoke('toggle_panel', { label: 'now' }).catch((err) => console.warn(err));
}

/** Żywe odliczania w widgetach (bez pełnego renderu). */
function tickCounts() {
  for (const b of dock.querySelectorAll('.app[data-count]')) {
    const end = new Date(b.dataset.count);
    if (isNaN(end)) continue;
    const v = b.querySelector('.w-chip');
    if (v) v.textContent = shortDur(end - Date.now());
  }
}
setInterval(tickCounts, 1000);

function render(s) {
  if (dragging) return;
  const cards = cardsFor(s);
  const key = JSON.stringify(s.dock) + Object.keys(icons).length + Object.values(runIcons).filter(Boolean).length
    + (cards ? JSON.stringify(s.windowTitles) : '') + s.fgExe + cards
    + JSON.stringify([s.focus, s.next, s.radio, s.quietUntil, s.weather, s.music && s.music.title, s.music && s.music.playing, s.clock]);
  if (key === lastKey) return;
  lastKey = key;
  dock.innerHTML = s.dock.map((a) => {
    const card = cards && a.windows > 0 && !a.widget;
    const active = a.exe && a.exe === s.fgExe;
    const lbl = card ? cardLabel(s, a) : null;
    const wd = a.widget ? widgetData(a, s) : null;
    const count = wd && wd.count ? ` data-count="${esc(wd.count)}" ` : '';
    return `
    <button class="app ${a.dim ? 'dim' : ''} ${a.stack ? 'stack' : ''} ${a.unpinned ? 'unpinned' : ''} ${card ? 'card' : ''} ${active ? 'active' : ''} ${wd ? 'wgt' : ''}" data-widget="${wd ? esc(a.widget) : ''}" data-stack="${a.stack ? 1 : ''}" data-id="${esc(a.id)}" data-name="${esc(a.name)}" aria-label="${esc(wd ? wd.label : a.name)}${a.dim ? ' (wyciszone w tym trybie)' : ''}"${count}>
      ${wd ? widgetTile(wd) : tile(a)}
      ${card ? `<span class="lbl"><b>${esc(lbl.title)}</b>${lbl.sub ? `<span>${esc(lbl.sub)}</span>` : ''}</span>` : ''}
      <span class="stripe" style="background:${a.stripe}"></span>
      ${wd ? '' : (a.badgeMuted ? '<span class="badge muted" aria-label="nieprzeczytana poczta — wyciszone w fokusie" title="Poczta czeka — licznik wyciszony w fokusie"></span>'
        : a.badge ? `<span class="badge" aria-label="${a.badge} nowych">${a.badge > 99 ? '99+' : a.badge}</span>`
        : !card && (a.windows || a.running) ? `<span class="dots" aria-hidden="true">${'<i></i>'.repeat(Math.min(3, Math.max(1, a.windows || 1)))}</span>` : '')}
    </button>${a.separatorAfter ? '<span class="sep" aria-hidden="true"></span>' : ''}`;
  }).join('');
  for (const b of dock.querySelectorAll('.app')) {
    const id = b.dataset.id;
    const isStack = b.dataset.stack === '1';
    // Widgety: klik → akcja (bez kółka, przeciągania i podglądów okien). Bez tooltipa —
    // szczegóły po kliknięciu (pogoda rozwija notkę), a dymek podglądów potrafił gubić tekst.
    if (b.dataset.widget) {
      const item = s.dock.find((x) => x.id === id);
      b.onclick = () => { if (item && !suppressClick) widgetClick(item); };
      continue;
    }
    b.onclick = (e) => {
      if (suppressClick) return;
      clearTimeout(hoverTimer);
      if (isStack && !e.shiftKey) {
        const r = b.getBoundingClientRect();
        invoke('previews_hide');
        invoke('stack_open', { id, anchor: r.left + r.width / 2 }).catch((err) => console.warn(err));
        return;
      }
      if (e.shiftKey) invoke('launch_new', { id });
      else invoke('launch', { id }).catch((err) => console.warn(err));
      invoke('previews_hide');
    };
    b.onauxclick = (e) => { if (e.button === 1) invoke('launch_new', { id }); };
    // Kółko myszy: przełączanie między oknami tej aplikacji.
    let wheelAt = 0;
    b.onwheel = (e) => {
      e.preventDefault();
      const now = Date.now();
      if (now - wheelAt < 160) return;
      wheelAt = now;
      clearTimeout(hoverTimer);
      invoke('previews_hide');
      invoke('dock_cycle', { id, dir: e.deltaY > 0 ? 1 : -1 });
    };
    // Przeciąganie ikon (tylko przypiętych): zmiana kolejności i sekcji.
    if (!id.startsWith('run:')) {
      b.onpointerdown = (e) => {
        if (e.button !== 0) return;
        const startX = e.clientX;
        let active = false;
        const move = (ev) => {
          if (!active && Math.abs(ev.clientX - startX) > 6) {
            active = true;
            dragging = id;
            b.classList.add('dragging');
            clearTimeout(hoverTimer);
            invoke('previews_hide');
            b.setPointerCapture(e.pointerId);
          }
          if (!active) return;
          const pinned = [...dock.querySelectorAll('.app')].filter((x) => x !== b && !x.dataset.id.startsWith('run:') && !x.dataset.widget);
          const target = pinned.find((x) => { const r = x.getBoundingClientRect(); return ev.clientX < r.left + r.width / 2; });
          if (target) {
            if (b.nextElementSibling !== target) dock.insertBefore(b, target);
          } else if (pinned.length) {
            const last = pinned[pinned.length - 1];
            const after = last.nextElementSibling?.classList.contains('sep') ? last.nextElementSibling : last;
            if (after.nextElementSibling !== b) after.after(b);
          }
        };
        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          if (!active) return;
          suppressClick = true;
          setTimeout(() => { suppressClick = false; }, 50);
          b.classList.remove('dragging');
          const order = [...dock.querySelectorAll('.app')].filter((x) => !x.dataset.id.startsWith('run:') && !x.dataset.widget).map((x) => x.dataset.id);
          dragging = null;
          lastKey = '';
          invoke('dock_reorder', { order, moved: id }).catch((err) => console.warn(err));
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      };
    }
    // Prawy klik na otwartej aplikacji spoza docka: przypnij ją na stałe.
    if (id.startsWith('run:')) {
      b.oncontextmenu = (e) => {
        e.preventDefault();
        e.stopPropagation();
        invoke('previews_hide');
        invoke('dock_pin', { exe: id.slice(4) }).catch((err) => console.warn(err));
      };
    }
    // Najechanie: po chwili żywe podglądy okien tej aplikacji.
    b.onmouseenter = () => {
      clearTimeout(hoverTimer);
      emitTo('preview', 'preview-enter', null);
      const r = b.getBoundingClientRect();
      const anchor = r.left + r.width / 2;
      const item = s.dock.find((x) => x.id === id);
      const name = item ? (item.unpinned ? `${item.name} · prawy klik: przypnij` : item.name) : '';
      invoke('previews_tip', { text: name, anchor });
      if (!isStack) hoverTimer = setTimeout(() => invoke('previews_show', { id, anchor }), 450);
    };
    b.onmouseleave = () => { clearTimeout(hoverTimer); emitTo('preview', 'preview-leave', null); };
  }
  dock.oncontextmenu = (e) => { e.preventDefault(); invoke('open_settings'); };
  // Okno docka dopasowuje się do szerokości ikon (+ miejsce na podpowiedź).
  requestAnimationFrame(() => {
    const width = Math.ceil(dock.getBoundingClientRect().width) + 8;
    invoke('dock_resize', { width });
  });
}
</script>
</body>
</html>
