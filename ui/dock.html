<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Edge Shell — dock</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { display: flex; align-items: flex-end; justify-content: center; }
  nav { --z: 1; flex: none; transform: scale(var(--z)); transform-origin: 50% 100%; display: inline-flex; align-items: flex-end; gap: 8px; padding: 10px 10px 7px; margin-bottom: 4px; border-radius: 22px; background: rgba(16,16,19,0.86); border: 1px solid var(--line); }
  .app { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 0; border: 0; background: transparent; transition: transform 0.12s ease; }
  .app:hover { transform: translateY(-3px); }
  .tile { width: 52px; height: 52px; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
  .tile.real { background: transparent !important; }
  .tile img { width: 44px; height: 44px; object-fit: contain; image-rendering: auto; }
  .stripe { width: 28px; height: 3px; border-radius: 2px; }
  .app.dim { opacity: 0.35; filter: grayscale(1); }
  .app.unpinned .stripe { width: 6px; border-radius: 50%; height: 4px; }
  .app.dim .stripe { background: transparent !important; }
  .dots { position: absolute; top: -4px; right: -2px; display: flex; gap: 2px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px #18181b; }
  .badge.muted { min-width: 10px; width: 10px; height: 10px; padding: 0; top: -2px; right: -2px; background: #71717a; }
  .badge { position: absolute; top: -5px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #ef4444; color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; box-shadow: 0 0 0 2px #18181b; }
  .app.stack .tile.real img { width: 46px; height: 46px; }
  @keyframes reveal { from { transform: scale(var(--z)) translateY(70%); opacity: 0.4; } to { transform: scale(var(--z)); opacity: 1; } }
  nav.reveal { animation: reveal 0.14s ease-out; }
  .app.dragging { opacity: 0.55; transform: translateY(-8px) scale(1.06); transition: none; }
  .app.drop-target .tile { outline: 2px solid #fbbf24; outline-offset: 3px; }
  nav.drop-add { outline: 2px dashed rgba(251,191,36,0.7); outline-offset: -3px; }
  /* Karty okien: otwarta aplikacja pokazuje tytuł okna obok ikony. */
  .app.card { flex-direction: row; align-items: center; gap: 10px; padding: 0 12px 0 0; border-radius: 15px; background: rgba(255,255,255,0.05); height: 52px; margin-bottom: 8px; }
  .app.card.active { background: rgba(255,255,255,0.11); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16); }
  .app.card .stripe { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); }
  .app.card .lbl { display: flex; flex-direction: column; gap: 2px; min-width: 0; max-width: 150px; text-align: left; }
  .app.card .lbl b { font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app.card .lbl span { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .app.card:hover { transform: none; background: rgba(255,255,255,0.1); }
  .app.active .stripe { width: 22px !important; background: #f4f4f5 !important; }
  .app .tile, .app.card .tile { transition: transform 0.16s cubic-bezier(.2,.9,.3,1.3); transform-origin: 50% 100%; }
  .sep { width: 1px; height: 34px; margin-bottom: 14px; background: rgba(255,255,255,0.12); }
  /* Widgety: żywe kafle obok ikon (blok, fokus, radio, pogoda, muzyka, odliczanie). */
  /* Widgety są kafelkami tej samej siatki co aplikacje — każdy ma własny „charakter”. */
   .app.wgt { width: 52px; height: auto; padding: 0; border-radius: 15px; background: transparent; }
   .app.wgt.w-weather, .app.wgt.w-music { width: auto; }
   .app.wgt .stripe { position: static; width: 28px; }
   .app.wgt .w-face.wide { width: auto; height: 52px; padding: 0 12px 0 10px; gap: 10px; justify-content: flex-start; text-align: left; }
   .wide .ws-ic { font-size: 30px; line-height: 1; margin: 0; }
   .wide .ws-col { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; line-height: 1.1; }
   .wide .ws-col b { font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
   .wide .ws-col small { font-size: 10px; opacity: 0.72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
   .w-weather .ws-temp b { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }
   .w-weather .ws-div { align-self: center; width: 1px; height: 28px; background: rgba(255,255,255,0.22); }
   .w-weather .ws-side { align-items: center; text-align: center; }
   .app.wgt.w-music .w-face.wide { width: 270px; max-width: 270px; gap: 9px; }
   .w-music .ws-col { overflow: hidden; }
   .w-music .ws-col b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
   .w-music .ws-art { position: relative; flex: none; width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.14) center/cover; display: grid; place-items: center; }
   .w-music .ws-art svg { width: 18px; height: 18px; }
   .w-music .ws-col { flex: 1 1 0; min-width: 0; }
   .w-music .ws-ctl { display: flex; align-items: center; gap: 2px; flex: none; }
   .w-music .ws-ctl [data-act] { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; color: #fff; }
   .w-music .ws-ctl [data-act]:hover { background: rgba(255,255,255,0.18); }
   .w-music .ws-ctl [data-act="toggle"] { background: rgba(255,255,255,0.2); }
   .w-music .ws-ctl svg { width: 11px; height: 11px; fill: currentColor; stroke: none; }
  .app.wgt:hover { transform: translateY(-3px); }
  .w-face { --t1: rgba(255,255,255,0.1); --t2: rgba(255,255,255,0.04); --edge: rgba(255,255,255,0.1); --fg: #e4e4e7;
    position: relative; width: 52px; height: 52px; border-radius: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: linear-gradient(145deg, var(--t1), var(--t2)); border: 1px solid var(--edge); color: var(--fg); }
  .w-face.tone-sky { --t1: rgba(14,116,224,0.8); --t2: rgba(56,189,248,0.4); --edge: rgba(125,211,252,0.5); --fg: #fff; }
  .w-face.tone-night { --t1: rgba(30,58,138,0.95); --t2: rgba(15,23,42,0.9); --edge: rgba(96,165,250,0.4); --fg: #dbeafe; }
  .w-face.tone-amber { --t1: rgba(217,119,6,0.55); --t2: rgba(120,53,15,0.4); --edge: rgba(251,191,36,0.45); --fg: #fde68a; }
  .w-face.tone-red { --t1: rgba(185,28,28,0.6); --t2: rgba(69,10,10,0.5); --edge: rgba(248,113,113,0.5); --fg: #fecaca; }
  .w-face.tone-rose { --t1: rgba(190,24,93,0.65); --t2: rgba(80,7,36,0.5); --edge: rgba(244,114,182,0.5); --fg: #fbcfe8; }
  .w-face.tone-green { --t1: rgba(21,128,61,0.55); --t2: rgba(5,46,22,0.4); --edge: rgba(74,222,128,0.45); --fg: #bbf7d0; }
  .w-face.tone-violet { --t1: rgba(109,40,217,0.65); --t2: rgba(157,23,77,0.5); --edge: rgba(192,132,252,0.5); --fg: #fff; }
  .w-symbol { font-size: 25px; line-height: 1; margin-top: -7px; }
  .w-glyph { display: flex; margin-top: -2px; }
  .w-face:has(.w-chip) .w-glyph { margin-top: -9px; }
  .w-ring ~ .w-glyph svg { width: 18px; height: 18px; }
  .w-chip { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 11px; font-weight: 800; line-height: 13px; letter-spacing: 0.2px; color: var(--fg); text-shadow: 0 1px 3px rgba(0,0,0,0.45); }
  .w-art { position: absolute; inset: 0; background: center/cover; }
  .w-art + .w-glyph { position: relative; padding: 6px; border-radius: 50%; background: rgba(0,0,0,0.5); margin: 0; }
  .w-eq { position: absolute; left: 0; right: 0; bottom: 5px; display: flex; justify-content: center; align-items: flex-end; gap: 2px; height: 12px; }
  .w-eq i { width: 3px; border-radius: 2px; background: #fff; box-shadow: 0 0 4px rgba(0,0,0,0.5); animation: eq 0.9s ease-in-out infinite; }
  .w-eq i:nth-child(2) { animation-delay: -0.3s; } .w-eq i:nth-child(3) { animation-delay: -0.6s; } .w-eq i:nth-child(4) { animation-delay: -0.15s; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }
  .w-ring { position: absolute; top: 4px; left: 9px; width: 34px; height: 34px; border-radius: 50%; background: conic-gradient(#f87171 calc(var(--p) * 1%), rgba(255,255,255,0.12) 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); }
  .w-face.pulse { animation: wpulse 2.4s ease-in-out infinite; }
  @keyframes wpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(248,113,113,0); } 50% { box-shadow: 0 0 12px 1px rgba(248,113,113,0.35); } }
   /* Parametry systemu są częścią docka: sam pierścień z ikoną, szczegóły po najechaniu. */
   /* Parametry systemu: sam pierścień z ikoną; szczegóły w dymku po najechaniu. */
   .metrics { display:flex; align-items:center; gap:3px; padding:3px; margin:0 0 6px 2px; border-radius:16px;
     background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.055); }
   .metric { position:relative; width:44px; height:48px; border-radius:13px; color:var(--muted); display:grid; place-items:center; cursor:default; outline:0; }
   .metric:hover, .metric.open { background:rgba(255,255,255,0.09); }
   .metric-ring { --p:0; --c:#fbbf24; position:relative; width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
     background:conic-gradient(var(--c) calc(var(--p) * 1%), rgba(255,255,255,0.12) 0); }
   .metric-ring::before { content:""; position:absolute; inset:3px; border-radius:50%; background:#17181d; }
   .metric-ring svg { position:relative; width:12px; height:12px; fill:none; stroke:var(--c); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  /* Postęp pobierania na ikonie folderu Pobrane i przeglądarki. */
  .app:not(.card) .dl { position: absolute; left: 8px; right: 8px; bottom: 14px; height: 6px; border-radius: 3px; background: rgba(0,0,0,.62); box-shadow: 0 0 0 1px rgba(255,255,255,.2); overflow: hidden; display: none; pointer-events: none; }
  .app[data-dl="1"] .dl { display: block; }
  .dl i { display: block; height: 100%; width: var(--p, 0%); border-radius: 3px; background: #34d399; transition: width .6s linear; }
  .dl.ind i { width: 40%; animation: dlind 1.1s ease-in-out infinite alternate; }
  @keyframes dlind { from { margin-left: 0; } to { margin-left: 60%; } }
  /* Kosz: ikona w stylu wzorca, stan pusty / pełny. */
  .app.trash .tile { background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)); border: 1px solid rgba(255,255,255,0.1); color: #d4d4d8; }
  .app.trash .tile svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .app.trash.full .tile { color: #fff; }
  .app.trash .stripe { background: transparent; }
  .app.trash.drop-target .tile { outline: 2px solid #f87171; outline-offset: 3px; }
</style>
</head>
<body>
<nav id="dock" aria-label="Dock"></nav>
<script type="module">
import { invoke, listen, onSnapshot, esc, icon } from './shared.js';

const dock = document.getElementById('dock');
let lastKey = '';
let icons = {};
let snap = null;
let stats = {};
let trash = { items: 0 };
let zoom = 1;
let hoverTimer = null;
let dockWidth = 0;
let contextApp = null;
const { emitTo } = window.__TAURI__.event;

/** Menu jak w pasku zadań: jest nad dockiem, nie w jego niskim WebView. */
function showAppContext(app, button) {
  contextApp = app;
  clearTimeout(hoverTimer);
  invoke('previews_hide');
  const pinned = !app.unpinned && !app.id.startsWith('run:');
  const key = `${app.id} ${app.name} ${app.process || ''}`.toLowerCase();
  const section = (label, separator = false) => ({ action: '', label, section: true, separator });
  const items = [];
  // Excel i inne aplikacje biurowe: ostatnie dokumenty z Windows Recent.
  if (/excel|\.xls/.test(key)) {
    const docs = (snap?.recent || []).filter((r) => /\.(xlsx?|xlsm|xlsb|csv)$/i.test(r.path)).slice(0, 8);
    if (docs.length) {
      items.push(section('OSTATNIE'));
      items.push(...docs.map((r) => ({ action: 'recent', label: r.name, value: r.path })));
    }
  }
  // Outlook: równoważnik sekcji „Zadania” z menu Windows.
  if (/outlook|\bolk\b/.test(key)) {
    items.push(section('ZADANIA', items.length > 0));
    items.push(
      { action: 'quick:outlook-mail', label: 'Nowa wiadomość e-mail' },
      { action: 'quick:outlook-meeting', label: 'Nowe spotkanie' },
      { action: 'quick:outlook-contact', label: 'Nowy kontakt' },
      { action: 'quick:outlook-task', label: 'Nowe zadanie' },
    );
  }
  // Vivaldi i inne przeglądarki: szybkie działania zamiast sztywnej listy stron.
  if (/vivaldi|chrome|msedge|firefox|browser/.test(key)) {
    items.push(section('SZYBKIE DZIAŁANIA', items.length > 0));
    items.push(
      { action: 'quick:browser-tab', label: 'Nowa karta' },
      { action: 'quick:browser-window', label: 'Nowe okno' },
      { action: 'quick:browser-private', label: 'Nowe okno prywatne' },
    );
  }
  if (/teams|msteams/.test(key)) {
    items.push(section('ZADANIA', items.length > 0));
    items.push({ action: 'quick:teams-chat', label: 'Nowa rozmowa' }, { action: 'quick:teams-meeting', label: 'Nowe spotkanie' });
  }
  items.push(section('APLIKACJA', items.length > 0));
  items.push(
    { action: 'open', label: app.windows ? `Przełącz na ${app.name}` : `Otwórz ${app.name}` },
    { action: 'new', label: 'Otwórz nowe okno' },
  );
  if (app.windows) items.push({ action: 'close', label: `Zamknij ${app.windows === 1 ? 'okno' : 'wszystkie okna'}`, danger: true, separator: true });
  items.push(pinned
    ? { action: 'unpin', label: 'Odepnij od docka', separator: !app.windows }
    : { action: 'pin', label: 'Przypnij do docka', separator: !app.windows });
  const r = button.getBoundingClientRect();
  invoke('previews_context', { anchor: r.left + r.width / 2, items }).catch((err) => console.warn(err));
}

listen('dock-context-action', ({ action, value }) => {
  const app = contextApp;
  contextApp = null;
  if (!app) return;
  if (action === 'open') invoke('launch', { id: app.id }).catch((err) => console.warn(err));
  if (action === 'new') invoke('launch_new', { id: app.id }).catch((err) => console.warn(err));
  if (action === 'close') invoke('dock_close_windows', { id: app.id }).catch((err) => console.warn(err));
  if (action === 'pin') invoke('dock_pin', { exe: app.id.slice(4) }).catch((err) => console.warn(err));
  if (action === 'unpin') invoke('dock_unpin', { id: app.id }).catch((err) => console.warn(err));
  if (action === 'recent' && value) invoke('dock_open_with', { id: app.id, paths: [value] }).catch((err) => console.warn(err));
  if (action.startsWith('quick:')) invoke('dock_quick_action', { id: app.id, action: action.slice(6) }).catch((err) => console.warn(err));
});

async function loadIcons() {
  icons = await invoke('dock_icons').catch(() => ({}));
  lastKey = '';
  if (snap) render(snap);
}
listen('config-changed', loadIcons);
loadIcons();

// Ikony otwartych aplikacji spoza docka (z pliku .exe), pobierane raz.
const runIcons = {};
function runIcon(a) {
  if (!(a.id in runIcons)) {
    runIcons[a.id] = null;
    invoke('app_icon', { path: a.path }).then((url) => {
      runIcons[a.id] = url;
      if (url) { lastKey = ''; if (snap) render(snap); }
    }).catch(() => {});
  }
  return runIcons[a.id];
}

const trashSvg = (full) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/>${full ? '<path d="M9.5 11.5l.4 5M14.5 11.5l-.4 5M12 11v6"/>' : ''}</svg>`;
function trashHtml() {
  return `<span class="sep" aria-hidden="true"></span>
    <button class="app trash ${trash.items ? 'full' : ''}" data-widget="trash" data-trash="1" data-id="trash" data-name="Kosz" aria-label="Kosz">
      <span class="tile">${trashSvg(trash.items > 0)}</span>
      <span class="stripe"></span>
    </button>`;
}
const trashTip = () => `Kosz · ${trash.items ? `${trash.items} ${trash.items === 1 ? 'element' : 'elementów'}` : 'pusty'}\nKlik: otwórz · prawy klik: opróżnij`;
async function refreshTrash() {
  const next = await invoke('trash_info').catch(() => null);
  if (!next || (next.items === trash.items)) return;
  trash = next;
  const b = dock.querySelector('.app.trash');
  if (!b) return;
  b.classList.toggle('full', trash.items > 0);
  b.querySelector('.tile').innerHTML = trashSvg(trash.items > 0);
}
setInterval(refreshTrash, 15000);
refreshTrash();

function tile(a) {
  if (a.unpinned) {
    const url = runIcon(a);
    if (url) return `<span class="tile real"><img src="${url}" alt=""></span>`;
    return `<span class="tile" style="background:${a.bg};color:${a.fg};font-weight:700;font-size:18px">${esc((a.name || '?')[0].toUpperCase())}</span>`;
  }
  if (a.icon === 'auto' && icons[a.id]) {
    return `<span class="tile real"><img src="${icons[a.id]}" alt=""></span>`;
  }
  const builtin = a.icon === 'auto' ? a.name : a.icon || a.name;
  return `<span class="tile" style="background:${a.bg};color:${a.fg}">${icon(builtin, 24)}</span>`;
}

onSnapshot((s) => { snap = s; render(s); });
const metricIcon = {
  cpu: '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/></svg>',
  mem: '<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="1.5"/><path d="M7 17v3M11 17v3M15 17v3"/></svg>',
  battery: '<svg viewBox="0 0 24 24"><rect x="3" y="7" width="17" height="10" rx="2"/><path d="M21 10v4"/><path d="M12 5v14"/></svg>',
};
const METRIC = {
  cpu: { color: '#ff9f0a', title: 'Procesor', more: true },
  mem: { color: '#30d158', title: 'Pamięć', more: true },
  battery: { color: '#ffd60a', title: 'Bateria', more: false },
};
const pct = (value) => Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
const history = { cpu: [], mem: [], battery: [] };
let procs = [];
let openKey = null;
let openTimer = null;
let procTimer = null;

const metricKeys = () => ['cpu', 'mem', 'battery'].filter((k) => stats[k] != null);
/** W docku zostaje sam pierścień; szczegóły są w osobnym oknie (dock nie zmienia rozmiaru). */
function metricsHtml() {
  const keys = metricKeys();
  return `<span class="metrics" data-metrics data-keys="${keys.join(',')}">${keys.map((k) => `
    <div class="metric" data-k="${k}" tabindex="0" role="button">
      <span class="metric-ring" style="--c:${METRIC[k].color}">${metricIcon[k]}</span>
    </div>`).join('')}</span>`;
}
const sizeText = (mb) => (mb >= 1024 ? `${(mb / 1024).toFixed(1)} GB` : `${Math.round(mb)} MB`);
function metricRows(k) {
  if (k === 'battery') return [['stan', stats.charging ? 'ładowanie' : 'na baterii'], ['poziom', `${pct(stats.battery)}%`]];
  if (k === 'mem') {
    const used = Number(stats.memUsedGb) || 0;
    const top = [...procs].sort((a, b) => b.memMb - a.memMb).slice(0, 3);
    const rest = Math.max(0, used * 1024 - top.reduce((n, p) => n + p.memMb, 0));
    return [['użyte', `${used.toFixed(1)} GB`], ['całość', `${Number(stats.memTotalGb || 0).toFixed(1)} GB`],
      ...(top.length ? [...top.map((p) => [p.name, sizeText(p.memMb)]), ['reszta', sizeText(rest)]] : [])];
  }
  const top = [...procs].sort((a, b) => b.cpu - a.cpu).slice(0, 3);
  const rest = Math.max(0, pct(stats.cpu) - top.reduce((n, p) => n + p.cpu, 0));
  return top.length ? [...top.map((p) => [p.name, `${Math.round(p.cpu)}%`]), ['reszta', `${Math.round(rest)}%`]] : [['procesy', 'mierzę…']];
}
function cardData(k) {
  const extra = k === 'cpu' ? `z ${navigator.hardwareConcurrency || '?'} rdzeni`
    : k === 'mem' ? `${Number(stats.memUsedGb || 0).toFixed(1)} / ${Number(stats.memTotalGb || 0).toFixed(1)} GB`
    : stats.charging ? 'ładowanie' : '';
  return { k, color: METRIC[k].color, title: `${METRIC[k].title} · teraz`, value: pct(stats[k]), extra,
    bars: history[k].map(pct), rows: metricRows(k), more: METRIC[k].more };
}
const pushCard = () => { if (openKey && stats[openKey] != null) emitTo('preview', 'metric-card', cardData(openKey)); };

/** Pierścienie aktualizują się w miejscu — bez podmiany elementów. */
function updateMetrics() {
  const box = dock.querySelector('[data-metrics]');
  if (!box) return;
  if (box.dataset.keys !== metricKeys().join(',')) {
    const shell = document.createElement('span');
    shell.innerHTML = metricsHtml();
    box.replaceWith(shell.firstElementChild);
    return updateMetrics();
  }
  for (const m of box.querySelectorAll('.metric')) {
    const k = m.dataset.k;
    m.querySelector('.metric-ring').style.setProperty('--p', pct(stats[k]));
    m.setAttribute('aria-label', `${METRIC[k].title} ${pct(stats[k])}%`);
  }
  pushCard();
}
const onStats = (next) => {
  stats = next || {};
  for (const k of Object.keys(history)) {
    if (stats[k] == null) continue;
    history[k].push(stats[k]);
    if (history[k].length > 24) history[k].shift();
  }
  updateMetrics();
};
listen('stats', onStats);
invoke('get_stats').then(onStats).catch(() => {});

async function loadProcs() {
  if (!openKey || !METRIC[openKey].more) return;
  procs = await invoke('sys_processes').catch(() => procs);
  pushCard();
}
function closeCard() {
  clearTimeout(openTimer);
  clearInterval(procTimer);
  openKey = null;
  for (const x of dock.querySelectorAll('.metric.open')) x.classList.remove('open');
}
// Karta pojawia się dopiero po krótkim zatrzymaniu kursora — samo przejechanie nic nie otwiera.
function openMetric(m) {
  const k = m.dataset.k;
  if (openKey === k) { emitTo('preview', 'preview-enter', null); return; }
  clearTimeout(openTimer);
  openTimer = setTimeout(async () => {
    closeCard();
    openKey = k;
    m.classList.add('open');
    const r = m.getBoundingClientRect();
    await invoke('previews_metric', { anchor: r.left + r.width / 2 }).catch(() => {});
    pushCard();
    loadProcs();
    procTimer = setInterval(loadProcs, 3000);
  }, 160);
}
function leaveMetric() {
  clearTimeout(openTimer);
  if (openKey) emitTo('preview', 'preview-leave', null);
}
// Okno karty zostało schowane (kursor odszedł) — dock przestaje je zasilać.
listen('preview-hidden', closeCard);
listen('metric-more', ({ k }) => {
  const m = dock.querySelector(`.metric[data-k="${k}"]`);
  if (!m) return;
  const r = m.getBoundingClientRect();
  invoke('popup_open', { view: k, from: 'dock', x: r.left, y: r.top - window.innerHeight, w: r.width, h: r.height });
});
dock.addEventListener('mouseover', (e) => {
  const m = e.target.closest?.('.metric');
  if (m && !m.contains(e.relatedTarget)) openMetric(m);
});
dock.addEventListener('mouseout', (e) => {
  const m = e.target.closest?.('.metric');
  if (m && !m.contains(e.relatedTarget)) leaveMetric();
});
dock.addEventListener('focusin', (e) => { const m = e.target.closest?.('.metric'); if (m) openMetric(m); });
dock.addEventListener('focusout', (e) => { if (e.target.closest?.('.metric')) leaveMetric(); });

// Lekkie powiększenie pod kursorem (najbliższa ikona 1.14, sąsiednie trochę mniej).
dock.addEventListener('mousemove', (e) => {
  if (dragging) return;
  for (const b of dock.querySelectorAll('.app')) {
    const t = b.querySelector('.tile');
    if (!t) continue;
    const r = t.getBoundingClientRect();
    const d = Math.abs(e.clientX - (r.left + r.width / 2));
    const k = Math.max(0, 1 - d / 120);
    t.style.transform = `scale(${1 + 0.14 * k * k})`;
  }
});
dock.addEventListener('mouseleave', () => {
  for (const t of dock.querySelectorAll('.tile')) t.style.transform = '';
});

// Upuszczanie plików z Eksploratora: na ikonę = otwórz w tej aplikacji
// (na stos = przenieś do folderu), na pusty fragment docka = przypnij.
const traceDrop = (stage) => invoke('dock_drop_trace', { stage }).catch(console.warn);
traceDrop('ui:loading');
function dropHit(pos) {
  if (!pos) return {};
  const r = window.devicePixelRatio || 1;
  const el = document.elementFromPoint(pos.x / r, pos.y / r);
  const app = el?.closest('.app');
  return { target: app && (!app.dataset.widget || app.dataset.trash) ? app : null,
    pin: el === dock || !!el?.closest('#dock .sep') };
}
function clearDrop() {
  for (const x of dock.querySelectorAll('.drop-target')) x.classList.remove('drop-target');
  dock.classList.remove('drop-add');
}
let toastTimer = null;
/** Wynik upuszczenia widać w dymku nad dockiem — wcześniej błędy trafiały tylko do konsoli. */
function dropToast(text, anchor, error = false) {
  invoke('previews_tip', { text: `${error ? '⚠ ' : '✓ '}${text}`, anchor });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => invoke('previews_hide'), error ? 4200 : 2200);
}
let externalDrag = false;
listen('dock-native-drop', (p) => {
  const { target: t, pin } = dropHit(p.position);
  if (p.type === 'over' || p.type === 'enter') {
    if (!externalDrag) {
      externalDrag = true;
      clearTimeout(hoverTimer);
      clearTimeout(toastTimer);
      // Osobne okno podglądu nie może przejąć kursora podczas przeciągania.
      invoke('previews_hide');
    }
    clearDrop();
    if (t) t.classList.add('drop-target'); else if (pin) dock.classList.add('drop-add');
  } else if (p.type === 'drop') {
    traceDrop('ui:drop');
    externalDrag = false;
    const r = (t || dock).getBoundingClientRect();
    const anchor = r.left + r.width / 2;
    clearDrop();
    if (!t && !pin) {
      traceDrop('ui:outside');
      dropToast('Upuść plik na ikonę aplikacji albo skrót na wolny fragment docka.', anchor, true);
      return;
    }
    if (!p.paths?.length) {
      traceDrop('ui:no-paths');
      dropToast('Windows nie przekazał ścieżki pliku. Przeciągnij plik albo skrót .exe/.lnk z Eksploratora lub pulpitu (elementy z menu Start i paska zadań nie mają ścieżki).', anchor, true);
      return;
    }
    traceDrop(t?.dataset.trash ? 'action:trash' : !t ? 'action:pin' : t.dataset.stack === '1' ? 'action:folder' : 'action:open');
    const run = t && t.dataset.trash ? invoke('trash_drop', { paths: p.paths }).then((n) => `Do kosza: ${n}`).finally(refreshTrash)
      : t ? invoke('dock_open_with', { id: t.dataset.id, paths: p.paths })
      : invoke('dock_add_paths', { paths: p.paths });
    run.then((msg) => { traceDrop('action:ok'); dropToast(msg, anchor); })
      .catch((err) => { traceDrop('action:error'); dropToast(String(err), anchor, true); });
  } else {
    externalDrag = false;
    clearDrop();
  }
}).then(() => traceDrop('ui:ready')).catch((err) => {
  console.warn('Nasłuch upuszczania w docku:', err);
  traceDrop('ui:listen-error');
});
// Wysunięcie docka (autoukrywanie): krótki wjazd od dołu.
listen('dock-reveal', () => {
  dock.classList.remove('reveal');
  void dock.offsetWidth;
  dock.classList.add('reveal');
});

let dragging = null;
let suppressClick = false;

/** Karty z tytułem okna, gdy jest miejsce; przy tłoku wszystko wraca do ikon. */
function cardsFor(s) {
  const withWin = s.dock.filter((a) => a.windows > 0 && !a.widget);
  const widgets = s.dock.filter((a) => a.widget).length;
  const maxW = (screen.availWidth || 1920) * 0.78;
  const est = (s.dock.length - widgets) * 60 + widgets * 60 + withWin.length * 150;
  return withWin.length <= 7 && est * zoom < maxW;
}
function cardLabel(s, a) {
  const titles = (s.windowTitles || {})[a.exe] || [];
  if (a.windows > 1) return { title: a.name, sub: `${a.windows} okna` };
  const t = titles[0] || a.name;
  // „Dokument — Aplikacja” → sam dokument; nazwa aplikacji jest w ikonie.
  const short = t.replace(/\s+[-—–|]\s+[^-—–|]+$/, '') || t;
  return { title: short, sub: short === t ? '' : a.name };
}

// --- Widgety -------------------------------------------------------------
const fmtClock = (d) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
const humanDur = (ms) => {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60), d = Math.floor(h / 24);
  return d >= 1 ? `${d} dni ${h % 24} h` : `${h} h ${String(m % 60).padStart(2, '0')} min`;
};

/** Wartości logiczne nigdy nie są tekstem UI. */
const text = (value) => (value === false || value == null ? '' : String(value));

/** Krótki czas na kafelek: 12m, 2h05, 3d. */
function shortDur(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h${String(m % 60).padStart(2, '0')}`;
  return `${Math.floor(h / 24)}d`;
}

/**
 * Dane widgetu: { ic|emoji, chip, tone, ring?, art?, eq?, pulse?, label, count? }.
 * Kafelek jest kwadratowy jak ikona; szczegóły są po kliknięciu.
 */
function widgetData(a, s) {
  const quiet = s.quietUntil ? new Date(s.quietUntil) : null;
  switch (a.widget) {
    case 'next-block': {
      const n = s.next;
      if (!n) return { ic: 'check', chip: 'wolne', tone: 'green', label: 'Plan na dziś: koniec listy' };
      const left = new Date(n.start) - Date.now();
      return { ic: 'clock', chip: left > 0 && left < 3600000 ? shortDur(left) : fmtClock(new Date(n.start)), tone: 'amber', label: `Następny blok: ${n.title}` };
    }
    case 'focus': {
      const f = s.focus;
      if (!f) return { ic: 'clock', chip: 'start', tone: 'slate', label: 'Fokus: nie trwa' };
      const start = new Date(f.start), end = new Date(f.end);
      const ring = Math.max(0, Math.min(1, (Date.now() - start) / Math.max(1, end - start)));
      return { ic: 'clock', chip: shortDur(end - Date.now()), tone: 'red', ring, pulse: !s.paused, count: f.end, label: `Fokus: ${f.title}` };
    }
    case 'radio': {
      const w = s.radio ? s.radio.waiting : 0;
      if (w) return { ic: 'radio', chip: String(w), tone: 'rose', pulse: true, label: `Radio: ${w} czeka` };
      if (quiet) return { ic: 'moon', chip: fmtClock(quiet), tone: 'slate', label: 'Radio wyciszone' };
      return { ic: 'radio', chip: '', tone: 'slate', label: 'Radio: cisza' };
    }
    case 'weather': {
      const w = s.weather;
      if (!w) return { ic: 'globe', chip: '', tone: 'sky', label: 'Pogoda: pobieram dane' };
      const hh = +String(s.clock || '12:00').split(':')[0];
      const day = (w.days || [])[0];
      const dn = ['Nd', 'Pn', 'Wt', 'Śr', 'Cz', 'Pt', 'Sb'][new Date().getDay()];
      return { emoji: w.emoji, chip: `${Math.round(w.temp)}°`, tone: hh >= 19 || hh < 6 ? 'night' : 'sky', label: `Pogoda: ${Math.round(w.temp)}°, ${w.text}`,
        city: w.label || w.text, dayName: dn, range: day ? `${day.hi}° / ${day.lo}°` : w.text };
    }
    case 'calendar': {
      const d = new Date();
      const day = d.getDate();
      const mon = d.toLocaleDateString('pl-PL', { month: 'short' }).replace('.', '');
      return { ic: 'calendar', chip: String(day), tone: 'red', label: `Kalendarz: ${day} ${mon}` };
    }
    case 'music': {
      const m = s.music;
      if (m && m.connected && m.title) return { ic: m.playing ? 'music' : 'pause', chip: '', tone: 'violet', art: m.art, eq: !!m.playing, playing: !!m.playing, title: m.title, artist: m.artist, label: `${m.playing ? 'Gra' : 'Pauza'}: ${m.title} — ${m.artist}` };
      return { ic: 'music', chip: '', tone: 'violet', label: 'Muzyka: niepołączona' };
    }
    case 'countdown': {
      const [label, when] = (a.widgetTarget || '').split('|');
      const end = new Date(when || '');
      if (isNaN(end)) return { ic: 'calendar', chip: '?', tone: 'slate', label: 'Odliczanie: ustaw cel w Dock → widgetTarget' };
      return { ic: 'calendar', chip: shortDur(end - Date.now()), tone: 'amber', count: end.toISOString(), label: `${label || 'Odliczanie'}` };
    }
    default: return { ic: 'clock', chip: '', tone: 'slate', label: a.name };
  }
}

/** Widgety są kwadratowe jak ikony; szczegóły są po kliknięciu w panelu/notce. */
const widgetTile = (w, a) => {
  if (a.widget === 'weather') {
    if (!w.city) return `<span class="w-face wide tone-${w.tone}"><span class="ws-ic" aria-hidden="true">🌡️</span><span class="ws-col"><b>Pogoda</b><small>pobieram dane</small></span></span>`;
    return `<span class="w-face wide tone-${w.tone}"><span class="ws-ic" aria-hidden="true">${esc(text(w.emoji))}</span>
      <span class="ws-col ws-temp"><b>${esc(text(w.chip))}</b><small>${esc(text(w.city))}</small></span>
      <span class="ws-div"></span>
      <span class="ws-col ws-side"><b>${esc(w.dayName)}</b><small>${esc(w.range)}</small></span></span>`;
  }
  if (a.widget === 'music') {
    if (!w.title) return `<span class="w-face wide tone-violet"><span class="ws-art">${icon('music', 18)}</span><span class="ws-col"><b>Muzyka</b><small>niepołączona</small></span></span>`;
    const art = w.art ? ` style="background-image:url('${esc(text(w.art))}')"` : '';
    return `<span class="w-face wide tone-violet"><span class="ws-art"${art}>${w.art ? '' : icon('music', 18)}</span>
      <span class="ws-col"><small>${w.playing ? 'Teraz gra' : 'Pauza'}</small><b>${esc(text(w.artist) ? `${w.title} – ${w.artist}` : w.title)}</b></span>
      <span class="ws-ctl">
        <span data-act="previous" role="button" aria-label="Poprzedni">${icon('prev', 11)}</span>
        <span data-act="toggle" role="button" aria-label="${w.playing ? 'Pauza' : 'Odtwórz'}">${icon(w.playing ? 'pause' : 'play', 11)}</span>
        <span data-act="next" role="button" aria-label="Następny">${icon('next', 11)}</span>
      </span></span>`;
  }
  const art = w.art ? `<span class="w-art" style="background-image:url('${esc(text(w.art))}')"></span>` : '';
  const ring = w.ring != null ? `<span class="w-ring" style="--p:${Math.round(w.ring * 100)}"></span>` : '';
  const sym = w.emoji ? `<span class="w-symbol" aria-hidden="true">${esc(text(w.emoji))}</span>` : `<span class="w-glyph">${icon(text(w.ic), 22)}</span>`;
  const eq = w.eq ? '<span class="w-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>' : '';
  const chip = w.chip ? `<span class="w-chip">${esc(text(w.chip))}</span>` : '';
  return `<span class="w-face tone-${w.tone}${w.pulse ? ' pulse' : ''}">${art}${ring}${sym}${eq}${chip}</span>`;
};

/** Klik w widget: radio → czekające, muzyka → play/pauza, pogoda → prognoza w notce, reszta → panel Teraz. */
function widgetClick(a) {
  invoke('previews_hide');
  if (a.widget === 'radio') { invoke('radio_show_waiting').catch((err) => console.warn(err)); return; }
  if (a.widget === 'music') { invoke('player_toggle').catch((err) => console.warn(err)); return; }
  if (a.widget === 'weather') { invoke('weather_show').catch((err) => console.warn(err)); return; }
  if (a.widget === 'calendar') { invoke('toggle_calendar').catch((err) => console.warn(err)); return; }
  invoke('toggle_panel', { label: 'now' }).catch((err) => console.warn(err));
}

/** Żywe odliczania w widgetach (bez pełnego renderu). */
function tickCounts() {
  for (const b of dock.querySelectorAll('.app[data-count]')) {
    const end = new Date(b.dataset.count);
    if (isNaN(end)) continue;
    const v = b.querySelector('.w-chip');
    if (v) v.textContent = shortDur(end - Date.now());
  }
}
setInterval(tickCounts, 1000);

/** Pasek pobierania na ikonach folderu Pobrane i przeglądarek — aktualizowany bez przerysowania docka. */
function updateDownloads(s) {
  const d = s.download;
  for (const b of dock.querySelectorAll('.app')) {
    const bar = b.querySelector('.dl');
    if (!bar) continue;
    b.dataset.dl = d ? '1' : '';
    bar.classList.toggle('ind', !!d && d.progress == null);
    if (d && d.progress != null) bar.style.setProperty('--p', `${Math.round(d.progress * 100)}%`);
  }
}

function render(s) {
  if (dragging) return;
  updateDownloads(s);
  zoom = Math.max(0.7, Math.min(1.4, (s.dockScale || 100) / 100));
  dock.style.setProperty('--z', zoom);
  const cards = cardsFor(s);
  const key = JSON.stringify(s.dock) + Object.keys(icons).length + Object.values(runIcons).filter(Boolean).length
    + (cards ? JSON.stringify(s.windowTitles) : '') + s.fgExe + cards
    + JSON.stringify([s.dockScale, s.showTrash, s.focus, s.next, s.radio, s.quietUntil, s.weather, s.music && s.music.title, s.music && s.music.playing, s.clock]);
  if (key === lastKey) return;
  lastKey = key;
  dock.innerHTML = s.dock.map((a) => {
    const card = cards && a.windows > 0 && !a.widget;
    const active = a.exe && a.exe === s.fgExe;
    const lbl = card ? cardLabel(s, a) : null;
    const wd = a.widget ? widgetData(a, s) : null;
    const count = wd && wd.count ? ` data-count="${esc(wd.count)}" ` : '';
    return `
    <button class="app ${a.dim ? 'dim' : ''} ${a.stack ? 'stack' : ''} ${a.unpinned ? 'unpinned' : ''} ${card ? 'card' : ''} ${active ? 'active' : ''} ${wd ? `wgt w-${a.widget}` : ''}" data-widget="${wd ? esc(a.widget) : ''}" data-stack="${a.stack ? 1 : ''}" data-id="${esc(a.id)}" data-name="${esc(a.name)}" aria-label="${esc(wd ? wd.label : a.name)}${a.dim ? ' (wyciszone w tym trybie)' : ''}"${count}>
       ${wd ? widgetTile(wd, a) : tile(a)}
      ${card ? `<span class="lbl"><b>${esc(lbl.title)}</b>${lbl.sub ? `<span>${esc(lbl.sub)}</span>` : ''}</span>` : ''}
      <span class="stripe" style="background:${a.stripe}"></span>
      ${a.dlTarget ? '<span class="dl"><i></i></span>' : ''}
      ${wd ? '' : (a.badgeMuted ? '<span class="badge muted" aria-label="nieprzeczytana poczta — wyciszone w fokusie" title="Poczta czeka — licznik wyciszony w fokusie"></span>'
        : a.badge ? `<span class="badge" aria-label="${a.badge} ${a.unreadBadge ? 'nieprzeczytanych wiadomości' : 'nowych powiadomień'}">${a.badge > 99 ? '99+' : a.badge}</span>`
        : !card && (a.windows || a.running) ? `<span class="dots" aria-hidden="true">${'<i></i>'.repeat(Math.min(3, Math.max(1, a.windows || 1)))}</span>` : '')}
    </button>${a.separatorAfter ? '<span class="sep" aria-hidden="true"></span>' : ''}`;
  }).join('') + (s.showTrash === false ? '' : trashHtml()) + metricsHtml();
  updateDownloads(s);
  for (const b of dock.querySelectorAll('.app')) {
    if (b.dataset.trash) {
      b.onclick = () => { invoke('previews_hide'); invoke('trash_open'); };
      b.oncontextmenu = (e) => {
        e.preventDefault();
        e.stopPropagation();
        invoke('previews_hide');
        invoke('trash_empty').then(refreshTrash).catch((err) => console.warn(err));
      };
      b.onmouseenter = () => {
        closeCard();
        clearTimeout(hoverTimer);
        emitTo('preview', 'preview-enter', null);
        const r = b.getBoundingClientRect();
        invoke('previews_tip', { text: trashTip(), anchor: r.left + r.width / 2 });
      };
      b.onmouseleave = () => { emitTo('preview', 'preview-leave', null); };
      continue;
    }
    const id = b.dataset.id;
    const isStack = b.dataset.stack === '1';
    // Widgety: klik → akcja (bez kółka, przeciągania i podglądów okien). Bez tooltipa —
    // szczegóły po kliknięciu (pogoda rozwija notkę), a dymek podglądów potrafił gubić tekst.
    if (b.dataset.widget) {
      const item = s.dock.find((x) => x.id === id);
      b.onclick = (e) => {
        const act = e.target.closest('[data-act]');
        if (act) {
          e.stopPropagation();
          const action = act.dataset.act === 'toggle' ? (snap?.music?.playing ? 'pause' : 'play') : act.dataset.act;
          invoke('spotify_control', { action }).catch((err) => console.warn(err));
          return;
        }
        if (item && !suppressClick) widgetClick(item);
      };
      continue;
    }
    b.onclick = (e) => {
      if (suppressClick) return;
      clearTimeout(hoverTimer);
      if (isStack && !e.shiftKey) {
        const r = b.getBoundingClientRect();
        invoke('previews_hide');
        invoke('stack_open', { id, anchor: r.left + r.width / 2 }).catch((err) => console.warn(err));
        return;
      }
      if (e.shiftKey) invoke('launch_new', { id });
      else invoke('launch', { id }).catch((err) => console.warn(err));
      invoke('previews_hide');
    };
    b.onauxclick = (e) => { if (e.button === 1) invoke('launch_new', { id }); };
    // Kółko myszy: przełączanie między oknami tej aplikacji.
    let wheelAt = 0;
    b.onwheel = (e) => {
      e.preventDefault();
      const now = Date.now();
      if (now - wheelAt < 160) return;
      wheelAt = now;
      clearTimeout(hoverTimer);
      invoke('previews_hide');
      invoke('dock_cycle', { id, dir: e.deltaY > 0 ? 1 : -1 });
    };
    // Przeciąganie ikon (tylko przypiętych): zmiana kolejności i sekcji.
    if (!id.startsWith('run:')) {
      b.onpointerdown = (e) => {
        if (e.button !== 0) return;
        const startX = e.clientX;
        let active = false;
        const move = (ev) => {
          if (!active && Math.abs(ev.clientX - startX) > 6) {
            active = true;
            dragging = id;
            b.classList.add('dragging');
            clearTimeout(hoverTimer);
            invoke('previews_hide');
            b.setPointerCapture(e.pointerId);
          }
          if (!active) return;
          const pinned = [...dock.querySelectorAll('.app')].filter((x) => x !== b && !x.dataset.id.startsWith('run:') && !x.dataset.widget);
          const target = pinned.find((x) => { const r = x.getBoundingClientRect(); return ev.clientX < r.left + r.width / 2; });
          if (target) {
            if (b.nextElementSibling !== target) dock.insertBefore(b, target);
          } else if (pinned.length) {
            const last = pinned[pinned.length - 1];
            const after = last.nextElementSibling?.classList.contains('sep') ? last.nextElementSibling : last;
            if (after.nextElementSibling !== b) after.after(b);
          }
        };
        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          if (!active) return;
          suppressClick = true;
          setTimeout(() => { suppressClick = false; }, 50);
          b.classList.remove('dragging');
          const order = [...dock.querySelectorAll('.app')].filter((x) => !x.dataset.id.startsWith('run:') && !x.dataset.widget).map((x) => x.dataset.id);
          dragging = null;
          lastKey = '';
          invoke('dock_reorder', { order, moved: id }).catch((err) => console.warn(err));
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      };
    }
    b.oncontextmenu = (e) => {
      e.preventDefault();
      e.stopPropagation();
      const item = s.dock.find((x) => x.id === id);
      if (item) showAppContext(item, b);
    };
    // Najechanie: po chwili żywe podglądy okien tej aplikacji.
    b.onmouseenter = () => {
      if (externalDrag) return;
      closeCard();
      clearTimeout(hoverTimer);
      emitTo('preview', 'preview-enter', null);
      const r = b.getBoundingClientRect();
      const anchor = r.left + r.width / 2;
      const item = s.dock.find((x) => x.id === id);
      const dl = item?.dlTarget && snap?.download ? ` · pobieranie${snap.download.progress != null ? ` ${Math.round(snap.download.progress * 100)}%` : ''}` : '';
      const name = item ? (item.unpinned ? `${item.name} · prawy klik: przypnij` : item.name + dl) : '';
      invoke('previews_tip', { text: name, anchor });
      if (!isStack) hoverTimer = setTimeout(() => invoke('previews_show', { id, anchor }), 450);
    };
    b.onmouseleave = () => { clearTimeout(hoverTimer); emitTo('preview', 'preview-leave', null); };
  }
  // Prawy klik w puste tło nie otwiera już ustawień Edge Shell.
  dock.oncontextmenu = (e) => e.preventDefault();
  // Okno docka dopasowuje się do szerokości ikon (+ miejsce na podpowiedź).
  requestAnimationFrame(() => {
    dockWidth = Math.ceil(dock.getBoundingClientRect().width) + 8;
    invoke('dock_resize', { width: dockWidth });
  });
}
</script>
</body>
</html>
