<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Edge Shell — kalendarz</title>
<link rel="stylesheet" href="shared.css">
<style>
  .panel { display: flex; flex-direction: column; gap: 14px; padding: 18px; background: rgba(18,18,21,0.97); }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .head h2 { margin: 0; font-size: 17px; font-weight: 600; text-transform: capitalize; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .dow { text-align: center; font-size: 11px; color: var(--muted); padding: 4px 0; }
  .day { position: relative; height: 40px; border-radius: 10px; border: 0; background: transparent; font-size: 13px; color: var(--text-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  .day:hover { background: var(--fill); }
  .day.other { color: #52525b; }
  .day.today { color: #fff; font-weight: 700; }
  .day.today::before { content: ''; position: absolute; inset: 3px; border-radius: 9px; border: 1.5px solid var(--accent); }
  .day.sel { background: var(--fill-strong); }
  .dots { display: flex; gap: 2px; height: 4px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; }
  .list { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
  .item { flex: none; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 10px; background: rgba(255,255,255,0.03); }
  .item .t { width: 82px; flex: none; font-size: 12px; color: var(--muted); }
  .item .b { width: 4px; height: 22px; flex: none; border-radius: 2px; }
  .foot { display: flex; gap: 8px; }
  .tl { position: relative; flex: 1; min-height: 160px; overflow-y: auto; border-radius: 12px; background: rgba(255,255,255,0.02); scrollbar-width: thin; }
  .tl .hr { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.06); }
  .tl .hl { position: absolute; left: 6px; font-size: 10px; color: var(--muted); transform: translateY(-50%); font-family: var(--mono); }
  .tl .now { position: absolute; left: 40px; right: 0; height: 2px; background: var(--accent); z-index: 2; }
  .blk { position: absolute; left: 44px; right: 8px; min-height: 18px; padding: 3px 8px; border-radius: 8px; font-size: 12px; overflow: hidden; border-left: 3px solid; background: rgba(255,255,255,0.07); display: flex; gap: 6px; align-items: flex-start; }
  .blk .tt { font-family: var(--mono); font-size: 10px; color: var(--muted); flex: none; padding-top: 1px; }
  .blk.drag { cursor: grab; }
  .blk.drag:hover { background: rgba(255,255,255,0.12); }
  .blk.moving { opacity: 0.85; box-shadow: 0 6px 16px rgba(0,0,0,0.5); z-index: 3; cursor: grabbing; }
  .day.dropping { outline: 2px solid var(--accent); }
  .hint2 { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div class="panel">
  <div class="head">
    <button class="icon-btn" id="prev" aria-label="Poprzedni miesiąc"></button>
    <h2 id="month"></h2>
    <button class="icon-btn" id="next" aria-label="Następny miesiąc"></button>
  </div>
  <div class="grid" id="grid"></div>
  <span class="label" id="dayTitle"></span>
  <div class="tl" id="list"></div>
  <span class="hint2" id="hint">Przeciągnij blok, żeby zmienić godzinę — albo na dzień w kalendarzu.</span>
  <div class="foot">
    <button class="btn" style="flex:1" id="horolog">Otwórz Horologa</button>
    <button class="btn" style="flex:1" id="report">Raport tygodnia</button>
  </div>
</div>
<script type="module">
import { invoke, onSnapshot, esc, icon, hhmm, KIND_LABEL } from './shared.js';

const $ = (id) => document.getElementById(id);
let week = [];
let accent = '#D42E25';
const today = new Date();
let view = new Date(today.getFullYear(), today.getMonth(), 1);
let selected = new Date(today.getFullYear(), today.getMonth(), today.getDate());

$('prev').innerHTML = icon('left', 18, 2);
$('next').innerHTML = icon('right', 18, 2);
$('prev').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); };
$('next').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); };
$('horolog').onclick = () => invoke('open_horolog');
$('report').onclick = () => { invoke('open_report'); invoke('hide_window', { label: 'calendar' }); };

const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const kindColor = (k) => (k === 'meeting' || k === 'busy') ? '#fbbf24' : k === 'buffer' ? '#71717a' : k === 'habit' ? '#4ade80' : accent;
const itemsOn = (d) => week.filter((i) => sameDay(new Date(i.start), d)).sort((a, b) => new Date(a.start) - new Date(b.start));

function render() {
  $('month').textContent = view.toLocaleDateString('pl-PL', { month: 'long', year: 'numeric' });
  const first = new Date(view);
  const offset = (first.getDay() + 6) % 7;
  const start = new Date(first.getFullYear(), first.getMonth(), 1 - offset);
  let html = ['pn', 'wt', 'śr', 'cz', 'pt', 'sb', 'nd'].map((d) => `<span class="dow">${d}</span>`).join('');
  for (let n = 0; n < 42; n++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + n);
    const items = itemsOn(d);
    const kinds = [...new Set(items.map((i) => i.kind))].slice(0, 4);
    const cls = [d.getMonth() !== view.getMonth() && 'other', sameDay(d, today) && 'today', sameDay(d, selected) && 'sel'].filter(Boolean).join(' ');
    html += `<button class="day ${cls}" data-t="${d.getTime()}" aria-label="${d.toLocaleDateString('pl-PL')}${items.length ? `, ${items.length} bloków` : ''}">
      <span>${d.getDate()}</span><span class="dots">${kinds.map((k) => `<i style="background:${kindColor(k)}"></i>`).join('')}</span></button>`;
  }
  $('grid').innerHTML = html;
  for (const b of $('grid').querySelectorAll('.day')) b.onclick = () => { selected = new Date(+b.dataset.t); render(); };

  $('dayTitle').textContent = sameDay(selected, today) ? 'Dziś' : selected.toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });
  const items = itemsOn(selected);
  const inRange = (selected - today) / 86400000 < 8 && (selected - today) / 86400000 > -2;
  renderTimeline(items, inRange);
}

// ------------------------------------------------------------------ oś dnia z przeciąganiem

const PX = 0.8;          // px na minutę
const FROM = 6 * 60;     // 6:00
const TO = 23 * 60;      // 23:00
const minsOf = (d) => d.getHours() * 60 + d.getMinutes();
const fmt = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const movable = (i) => i.intentId && !['meeting', 'busy', 'buffer'].includes(i.kind);

function renderTimeline(items, inRange) {
  const tl = $('list');
  let html = '';
  for (let h = FROM / 60; h <= TO / 60; h++) {
    const y = (h * 60 - FROM) * PX;
    html += `<span class="hr" style="top:${y}px"></span><span class="hl" style="top:${y}px">${String(h).padStart(2, '0')}</span>`;
  }
  if (sameDay(selected, today)) html += `<span class="now" style="top:${(minsOf(new Date()) - FROM) * PX}px"></span>`;
  html += items.map((i, n) => {
    const s = Math.max(FROM, minsOf(new Date(i.start)));
    const e = Math.min(TO, Math.max(s + 15, minsOf(new Date(i.end)) || TO));
    return `<div class="blk ${movable(i) ? 'drag' : ''}" data-n="${n}" style="top:${(s - FROM) * PX}px;height:${(e - s) * PX - 2}px;border-color:${kindColor(i.kind)}" title="${esc(i.title)} · ${hhmm(i.start)}–${hhmm(i.end)}${movable(i) ? ' · przeciągnij' : ''}">
      <span class="tt">${hhmm(i.start)}</span><span class="ellipsis">${esc(i.title)}</span></div>`;
  }).join('');
  tl.innerHTML = `<div style="position:relative;height:${(TO - FROM) * PX + 10}px">${html}</div>`;
  if (!items.length && !inRange) tl.insertAdjacentHTML('beforeend', '<div class="empty" style="position:absolute;top:8px;left:50px">Horolog planuje tylko najbliższe dni.</div>');
  // Przewiń do teraz albo do pierwszego bloku.
  const first = sameDay(selected, today) ? minsOf(new Date()) - 60 : items.length ? minsOf(new Date(items[0].start)) - 30 : 8 * 60;
  tl.scrollTop = Math.max(0, (first - FROM) * PX);
  for (const el of tl.querySelectorAll('.blk.drag')) wireDrag(el, items[+el.dataset.n]);
}

function wireDrag(el, item) {
  el.onpointerdown = (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    const startY = e.clientY;
    const top0 = parseFloat(el.style.top);
    const dur = Math.max(15, (new Date(item.end) - new Date(item.start)) / 60000);
    let moved = false;
    let minute = minsOf(new Date(item.start));
    let dropDay = null;
    el.setPointerCapture(e.pointerId);
    el.onpointermove = (ev) => {
      const dy = ev.clientY - startY;
      if (!moved && Math.abs(dy) < 4) return;
      moved = true;
      el.classList.add('moving');
      minute = Math.round((FROM + (top0 + dy) / PX) / 15) * 15;
      minute = Math.max(FROM, Math.min(TO - dur, minute));
      el.style.top = `${(minute - FROM) * PX}px`;
      el.querySelector('.tt').textContent = fmt(minute);
      // Nad komórką dnia w kalendarzu = przeniesienie na ten dzień.
      for (const d of document.querySelectorAll('.day.dropping')) d.classList.remove('dropping');
      const hit = document.elementsFromPoint(ev.clientX, ev.clientY).find((x) => x.classList?.contains('day'));
      dropDay = hit ? new Date(+hit.dataset.t) : null;
      if (hit) hit.classList.add('dropping');
      $('hint').textContent = dropDay ? `Na ${dropDay.toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric' })}, ${fmt(minsOf(new Date(item.start)))}` : `Nowa godzina: ${fmt(minute)}`;
    };
    el.onpointerup = async () => {
      el.onpointermove = null;
      el.onpointerup = null;
      for (const d of document.querySelectorAll('.day.dropping')) d.classList.remove('dropping');
      if (!moved) return;
      const base = dropDay || selected;
      const m = dropDay ? minsOf(new Date(item.start)) : minute;
      const start = new Date(base.getFullYear(), base.getMonth(), base.getDate(), Math.floor(m / 60), m % 60);
      $('hint').textContent = 'Horolog przeplanowuje…';
      try {
        await invoke('horolog_move', { intentId: item.intentId, start: start.toISOString() });
        await load();
        const now = week.find((w) => w.intentId === item.intentId && sameDay(new Date(w.start), start));
        $('hint').textContent = now && minsOf(new Date(now.start)) !== m
          ? `Horolog znalazł najbliższe wolne miejsce: ${hhmm(now.start)}`
          : 'Przeniesione.';
      } catch (err) {
        $('hint').textContent = `Nie przeniesiono: ${err}`;
        render();
      }
    };
  };
}

async function load() {
  week = await invoke('get_week').catch(() => []);
  render();
}
window.addEventListener('focus', load);
let lastSync = '';
onSnapshot((s) => {
  accent = s.mode.accent;
  if (s.horolog.lastSync !== lastSync) { lastSync = s.horolog.lastSync; load(); }
});
load();
</script>
</body>
</html>
